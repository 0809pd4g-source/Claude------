    confirm: ["⚠️優先度：10/5の説明では「中」、一覧の画像では「低」", "対象の帳票（医療機関向け・マイナポ向け）", "案件178（保存期間の延長）との関係"]
  }
];

const RELATIONS = [
  "<strong>219と220</strong>：どちらも承継の案件。219は「承継元の処方・検査も拾う」、220は「承継元の名前のまま表示する」。承継の判定方法と画面の見え方を一緒にそろえる。",
  "<strong>216と223</strong>：どちらも技術解説書の全国的な運用開始版に関係しそう。10/13に本田さんが言った「優先して進めてほしい案件」に当たるかは確認中。",
  "<strong>207・218・211</strong>：方向性は決まっていて、残りは文言（207・218）か見積もり（211）。厚労省の検討・機構の見積もり待ち。",
  "<strong>前身の案件</strong>：216←192（CLINS 1.10.0・1.11.0、健診1.5.0の終了）、219←206（取り下げ）、220←205（取り下げ・改修しない方針）。"
];

function el(tag, attrs, html) {
  const e = document.createElement(tag);
  if (attrs) Object.entries(attrs).forEach(([k, v]) => e.setAttribute(k, v));
  if (html !== undefined) e.innerHTML = html;
  return e;
}
function list(items) { return "<ul>" + items.map(i => "<li>" + i + "</li>").join("") + "</ul>"; }
function priBadge(p) { return '<span class="pri pri-' + p + '">' + p + "</span>"; }

function render() {
  document.title = window.DOC_TITLE;
  document.getElementById("pageTitle").textContent = window.DOC_TITLE;
  document.getElementById("metaLine").textContent = window.AS_OF + " 時点／" + window.VERSION + "／元資料：案件台帳（10/13受領版）と各案件の詳細化案（同じフォルダのMD）";
  document.getElementById("footer").textContent = window.DOC_TITLE + "　" + window.VERSION + "（" + window.AS_OF + "）";

  const body = document.getElementById("overviewBody");
  const listEl = document.getElementById("caseList");
  CASES.slice().sort((a, b) => a.order - b.order).forEach(c => {
    const tr = el("tr", { "data-pri": c.pri });
    tr.innerHTML =
      "<td>" + c.order + "</td>" +
      '<td class="id"><a href="#case-' + c.id + '">' + c.id + "</a></td>" +
      "<td>" + priBadge(c.pri) + "</td>" +
      "<td>" + c.short + "</td>" +
      "<td>" + c.asis[0] + "</td>" +
      "<td>" + c.tobe[0] + "</td>" +
      '<td class="status">' + c.status + "</td>";
    body.appendChild(tr);

    const card = el("article", { class: "card", id: "case-" + c.id, "data-pri": c.pri });
    card.innerHTML =
      '<div class="card-head"><span class="cid">' + c.id + "</span>" +
      '<span class="cname">' + c.short + "</span>" + priBadge(c.pri) +
      '<span class="ctag">' + c.area + "／" + c.status + "</span></div>" +
      '<div class="card-body">' +
      '<p class="official">台帳の案件名称：' + c.official + "</p>" +
      '<div class="flow">' +
      '<div class="box asis"><h3>ASIS（今）</h3>' + list(c.asis) + "</div>" +
      '<div class="box tobe"><h3>TOBE（こうしたい）</h3>' + list(c.tobe) + "</div>" +
      '<div class="box do"><h3>案件でやること</h3>' + list(c.doing) + "</div>" +
      "</div>" +
      "<details><summary>詳細化の要点</summary>" + list(c.points) + "</details>" +
      "<details><summary>主な確認事項</summary>" + list(c.confirm) + "</details>" +
      '<div class="links">詳細化案：<a href="' + c.file + '">' + c.file + "</a></div>" +
      "</div>";
    listEl.appendChild(card);
  });

  const rel = document.getElementById("relList");
  RELATIONS.forEach(r => rel.appendChild(el("div", null, r)));
}

function setupFilter() {
  const buttons = document.querySelectorAll("[data-filter]");
  buttons.forEach(btn => btn.addEventListener("click", () => {
    const f = btn.getAttribute("data-filter");
    buttons.forEach(b => b.setAttribute("aria-pressed", String(b === btn)));
    document.querySelectorAll("#overviewBody tr, #caseList .card").forEach(row => {
      row.hidden = !(f === "all" || row.getAttribute("data-pri") === f);
    });
  }));
  const toggle = document.getElementById("toggleAll");
  toggle.addEventListener("click", () => {
    const open = toggle.getAttribute("aria-pressed") !== "true";
    toggle.setAttribute("aria-pressed", String(open));
    toggle.textContent = open ? "詳細をすべて閉じる" : "詳細をすべて開く";
    document.querySelectorAll("#caseList details").forEach(d => { d.open = open; });
  });
}

render();
setupFilter();
</script>
</body>
</html>
