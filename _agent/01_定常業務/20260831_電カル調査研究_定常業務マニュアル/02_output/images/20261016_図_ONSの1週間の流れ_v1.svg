<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 172" role="img" aria-label="ONSの1週間の流れ"><title>ONSの1週間の流れ</title><defs><marker id="arr-ons" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dg-arrow"/></marker></defs><text x="12" y="24" class="dg-s" text-anchor="start">台帳①＝基金側（ONSチームとのやり取り）／台帳②＝厚労省側（厚労省内の検討）</text><rect x="12.0" y="40" width="144.33333333333334" height="92" rx="6" class="dg-work"/><text x="20.0" y="59" class="dg-b">月・水 受領</text><text x="20.0" y="76" class="dg-s">①の新規・更問を②へ転記</text><text x="20.0" y="91" class="dg-s">①L列 厚労省確認中</text><text x="20.0" y="106" class="dg-s">②M列 ACN回答作成</text><rect x="178.33333333333334" y="40" width="144.33333333333334" height="92" rx="6" class="dg-work"/><text x="186.33333333333334" y="59" class="dg-b">受領後〜金</text><text x="186.33333333333334" y="76" class="dg-s">既出か確認・回答案</text><text x="186.33333333333334" y="91" class="dg-s">区分：読み合せ／方針確認</text><text x="186.33333333333334" y="106" class="dg-s">Bは金曜中にRv依頼</text><line x1="158.33333333333334" y1="86" x2="176.33333333333334" y2="86" class="dg-line" marker-end="url(#arr-ons)"/><rect x="344.6666666666667" y="40" width="144.33333333333334" height="92" rx="6" class="dg-work"/><text x="352.6666666666667" y="59" class="dg-b">月〜火 Rv</text><text x="352.6666666666667" y="76" class="dg-s">本田さん→向井さん</text><text x="352.6666666666667" y="91" class="dg-s">読み合わせスクリプト</text><text x="352.6666666666667" y="106" class="dg-s">（7-2 会議前）</text><line x1="324.6666666666667" y1="86" x2="342.6666666666667" y2="86" class="dg-line" marker-end="url(#arr-ons)"/><rect x="511.0" y="40" width="144.33333333333334" height="92" rx="6" class="dg-mtg"/><text x="519.0" y="59" class="dg-b">火 14:15 会議</text><text x="519.0" y="76" class="dg-s">ONS問合せ会議で</text><text x="519.0" y="91" class="dg-s">厚労省と読み合わせ</text><text x="519.0" y="106" class="dg-s">（7-2 会議中）</text><line x1="491.0" y1="86" x2="509.0" y2="86" class="dg-line" marker-end="url(#arr-ons)"/><rect x="677.3333333333334" y="40" width="144.33333333333334" height="92" rx="6" class="dg-work"/><text x="685.3333333333334" y="59" class="dg-b">火 会議後</text><text x="685.3333333333334" y="76" class="dg-s">台帳綺麗化→本田さんRv</text><text x="685.3333333333334" y="91" class="dg-s">②M列 ONS回答済(日付)</text><text x="685.3333333333334" y="106" class="dg-s">日付＝連携日（翌水曜）</text><line x1="657.3333333333334" y1="86" x2="675.3333333333334" y2="86" class="dg-line" marker-end="url(#arr-ons)"/><rect x="843.6666666666667" y="40" width="144.33333333333334" height="92" rx="6" class="dg-work"/><text x="851.6666666666667" y="59" class="dg-b">水 返送</text><text x="851.6666666666667" y="76" class="dg-s">②の回答を①に転記</text><text x="851.6666666666667" y="91" class="dg-s">本田さんRv→080スレッド</text><text x="851.6666666666667" y="106" class="dg-s">①L列 厚労省回答済</text><line x1="823.6666666666667" y1="86" x2="841.6666666666667" y2="86" class="dg-line" marker-end="url(#arr-ons)"/><rect x="12" y="150" width="16" height="12" rx="2" class="dg-mtg"/><text x="34" y="161" class="dg-s" text-anchor="start">会議</text><rect x="122" y="150" width="16" height="12" rx="2" class="dg-work"/><text x="144" y="161" class="dg-s" text-anchor="start">作業・締切</text><rect x="232" y="150" width="16" height="12" rx="2" class="dg-box"/><text x="254" y="161" class="dg-s" text-anchor="start">社内定例</text></svg>
