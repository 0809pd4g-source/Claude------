<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 312" role="img" aria-label="周知の共通ルールとマスタ別ルール"><title>周知の共通ルールとマスタ別ルール</title><defs><marker id="arr-notice" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dg-arrow"/></marker></defs><rect x="250" y="10" width="500" height="70" rx="6" class="dg-mtg"/><text x="258" y="29" class="dg-b">周知の共通ルール（定常業務マニュアル）</text><text x="258" y="46" class="dg-s">8-4 DX機構への取り込み・ポータル更新の依頼メール</text><text x="258" y="61" class="dg-s">8-5 ポータルの周知文（期間で分ける構成・旧版の扱い）</text><rect x="21" y="130" width="300" height="70" rx="6" class="dg-box"/><text x="29" y="149" class="dg-b">J-FAGY（不定期）</text><text x="29" y="166" class="dg-s">個別ルールの正本：J-FAGYマスタ更新手順</text><text x="29" y="181" class="dg-s">周知する変更の範囲・KB0012085</text><line x1="500" y1="80" x2="171.0" y2="128" class="dg-line" marker-end="url(#arr-notice)"/><rect x="347" y="130" width="300" height="70" rx="6" class="dg-box"/><text x="355" y="149" class="dg-b">JLAC（月次）</text><text x="355" y="166" class="dg-s">個別ルールの正本：JLACマスタチェック手順 9-4</text><text x="355" y="181" class="dg-s">注記の更新はイレギュラー時のみ</text><line x1="500" y1="80" x2="497.0" y2="128" class="dg-line" marker-end="url(#arr-notice)"/><rect x="673" y="130" width="300" height="70" rx="6" class="dg-box"/><text x="681" y="149" class="dg-b">薬剤関連（月次）</text><text x="681" y="166" class="dg-s">個別ルールの正本：薬剤関連マスタ作成手順</text><text x="681" y="181" class="dg-s">周知の記載なし（要確認）</text><line x1="500" y1="80" x2="823.0" y2="128" class="dg-line" marker-end="url(#arr-notice)"/><text x="500" y="222" class="dg-s" text-anchor="middle">共通の型を使い、マスタ固有の事情（周知する変更・記事ID・旧版の扱い・実績）は各手順書に書く</text><rect x="15.0" y="266" width="220" height="34" rx="6" class="dg-work"/><text x="23.0" y="285" class="dg-b">1. 周知PPTを作る</text><rect x="265.0" y="266" width="220" height="34" rx="6" class="dg-work"/><text x="273.0" y="285" class="dg-b">2. 本田さんRv→OK</text><line x1="237.0" y1="283" x2="263.0" y2="283" class="dg-line" marker-end="url(#arr-notice)"/><rect x="515.0" y="266" width="220" height="34" rx="6" class="dg-work"/><text x="523.0" y="285" class="dg-b">3. 機構へ依頼メール</text><line x1="487.0" y1="283" x2="513.0" y2="283" class="dg-line" marker-end="url(#arr-notice)"/><rect x="765.0" y="266" width="220" height="34" rx="6" class="dg-work"/><text x="773.0" y="285" class="dg-b">4. ポータル公開・取り込みを確認</text><line x1="737.0" y1="283" x2="763.0" y2="283" class="dg-line" marker-end="url(#arr-notice)"/><text x="12" y="258" class="dg-s" text-anchor="start">毎回の流れ（どのマスタも同じ）</text></svg>
