// ─── Render sidebar
const nav = document.getElementById('nav');
CATS.forEach(cat => {
  const catSecs = SECTIONS.filter(s => s.cat === cat.id);
  if (!catSecs.length) return;
  const hd = document.createElement('div');
  hd.className = 'cat-hd';
  const badge = cat.cadence ? `<span class="cat-cadence ${cat.cadence}">${cat.cadence}</span>` : '';
  hd.innerHTML = `${badge}<span class="cat-name">${cat.name}</span><span class="cat-arrow">▾</span>`;
  const body = document.createElement('div');
  body.className = 'cat-body';
  catSecs.forEach(sec => {
    const ni = document.createElement('div');
    ni.className = 'ni';
    ni.dataset.id = sec.id;
    ni.innerHTML = `<span class="ni-bd bd-${sec.type}">${sec.type}</span><span class="ni-tx">${sec.title}</span>`;
    ni.addEventListener('click', () => showSec(sec.id));
    body.appendChild(ni);
  });
  hd.addEventListener('click', () => {
    hd.classList.toggle('collapsed');
    body.classList.toggle('collapsed');
  });
  nav.appendChild(hd);
  nav.appendChild(body);
});

// ─── Render sections
const ca = document.getElementById('ca');
const welcome = document.getElementById('welcome');
const srchRes = document.getElementById('srch-res');
SECTIONS.forEach(sec => {
  const div = document.createElement('div');
  div.className = 'sec';
  div.id = 'sec-' + sec.id;
  div.innerHTML = `
    <div class="sec-meta">
      <span class="sec-cadence ${sec.cadence}">${sec.cadence}</span>
      <span class="sec-type ${sec.type}">${sec.type}</span>
    </div>
    <div class="sec-h1">${sec.title}</div>
    <div class="cb">${sec.content}</div>
  `;
  ca.appendChild(div);
});

// ─── Navigation
let curId = null;
function showSec(id) {
  if (curId) {
    document.getElementById('sec-' + curId)?.classList.remove('active');
    document.querySelector(`.ni[data-id="${curId}"]`)?.classList.remove('active');
  }
  welcome.style.display = 'none';
  srchRes.style.display = 'none';
  const sec = SECTIONS.find(s => s.id === id);
  if (!sec) return;
  document.getElementById('sec-' + id)?.classList.add('active');
  document.querySelector(`.ni[data-id="${id}"]`)?.classList.add('active');
  document.getElementById('cur-ttl').textContent = sec.title;
  curId = id;
  ca.scrollTo(0, 0);
}

// ─── Search
function doSearch(q) {
  q = q.trim().toLowerCase();
  if (!q) {
    srchRes.style.display = 'none';
    if (curId) document.getElementById('sec-' + curId)?.classList.add('active');
    else welcome.style.display = 'block';
    return;
  }
  if (curId) document.getElementById('sec-' + curId)?.classList.remove('active');
  welcome.style.display = 'none';
  const hits = SECTIONS.filter(s =>
    s.title.toLowerCase().includes(q) ||
    s.content.replace(/<[^>]+>/g,'').toLowerCase().includes(q)
  );
  srchRes.innerHTML = hits.length
    ? hits.map(s => `<div class="sr-item" onclick="showSec('${s.id}');document.getElementById('srch-in').value='';doSearch('')"><div class="sr-sec">${s.cat} · ${s.cadence}</div><div class="sr-txt">${s.title}</div></div>`).join('')
    : '<p style="color:#6b7280;font-size:13px;padding:4px">該当なし</p>';
  srchRes.style.display = 'block';
}

// ─── Reset checkboxes
function resetChecks() {
  document.querySelectorAll('#ca input[type=checkbox]').forEach(cb => { cb.checked = false; });
}
</script>
