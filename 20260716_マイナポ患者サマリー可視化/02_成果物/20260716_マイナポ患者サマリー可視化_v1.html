<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>マイナポータル 患者サマリー 表示シミュレーター</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Meiryo UI', 'メイリオ', sans-serif; background: #f0f4f8; color: #222; font-size: 14px; }

  /* ===== ヘッダー ===== */
  .app-header {
    background: #00479e;
    color: #fff;
    padding: 12px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .app-header .logo { font-size: 18px; font-weight: bold; letter-spacing: .5px; }
  .app-header .sub { font-size: 11px; opacity: .8; margin-top: 2px; }
  .simulator-badge {
    margin-left: auto;
    background: #ff8c00;
    padding: 3px 10px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: bold;
  }

  /* ===== レイアウト ===== */
  .layout { display: flex; height: calc(100vh - 54px); }

  /* ===== 左パネル（設定） ===== */
  .sidebar {
    width: 300px;
    min-width: 300px;
    background: #fff;
    border-right: 1px solid #d0d7e2;
    overflow-y: auto;
    padding: 16px;
  }
  .sidebar h2 { font-size: 13px; color: #00479e; font-weight: bold; margin-bottom: 12px; border-bottom: 2px solid #00479e; padding-bottom: 6px; }
  .section { margin-bottom: 20px; }
  .section label { display: block; font-size: 12px; color: #555; margin-bottom: 4px; font-weight: bold; }

  /* ペルソナカード */
  .persona-card {
    border: 2px solid #dde3ed;
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 8px;
    cursor: pointer;
    transition: all .2s;
    background: #fafbfc;
  }
  .persona-card:hover { border-color: #00479e; background: #f0f4fc; }
  .persona-card.active { border-color: #00479e; background: #e8f0fb; }
  .persona-name { font-weight: bold; font-size: 13px; color: #222; }
  .persona-meta { font-size: 11px; color: #666; margin-top: 3px; }
  .persona-tag {
    display: inline-block;
    background: #e8f0fb;
    color: #00479e;
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 10px;
    margin-top: 4px;
    margin-right: 3px;
  }
  .persona-card.active .persona-tag { background: #c0d4f5; }

  /* 日付ピッカー */
  input[type="date"] {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid #ccd3de;
    border-radius: 6px;
    font-family: inherit;
    font-size: 13px;
    color: #222;
  }
  input[type="date"]:focus { outline: none; border-color: #00479e; box-shadow: 0 0 0 2px rgba(0,71,158,.2); }

  /* フィルター説明 */
  .filter-rules {
    background: #f5f7fc;
    border: 1px solid #dde3ed;
    border-radius: 6px;
    padding: 10px 12px;
    font-size: 11px;
    color: #555;
    line-height: 1.7;
  }
  .filter-rules strong { color: #00479e; }

  /* タイムライン（受診履歴） */
  .timeline { margin-top: 8px; }
  .visit-dot {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    margin-bottom: 8px;
    font-size: 11px;
  }
  .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    margin-top: 3px;
    flex-shrink: 0;
  }
  .dot.in-range { background: #00b050; }
  .dot.out-range { background: #ccc; }
  .visit-date { font-weight: bold; }
  .visit-hosp { color: #444; }
  .visit-label { font-size: 10px; padding: 1px 5px; border-radius: 3px; margin-left: 4px; }
  .visit-label.in { background: #d4edda; color: #155724; }
  .visit-label.out { background: #f0f0f0; color: #888; }

  /* ===== 右パネル（マイナポータル表示） ===== */
  .main {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
  }

  /* マイナポータル風ラッパー */
  .mynaportal-frame {
    max-width: 860px;
    margin: 0 auto;
  }
  .mynaportal-topbar {
    background: #00479e;
    color: #fff;
    padding: 8px 16px;
    border-radius: 8px 8px 0 0;
    font-size: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .mynaportal-topbar .icon { font-size: 16px; }
  .viewing-date-badge {
    margin-left: auto;
    background: rgba(255,255,255,.2);
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 11px;
  }
  .mynaportal-body {
    background: #fff;
    border: 1px solid #c8d0e0;
    border-top: none;
    border-radius: 0 0 8px 8px;
    padding: 20px;
    min-height: 400px;
  }

  /* 空状態 */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: #999;
  }
  .empty-state .icon { font-size: 40px; margin-bottom: 12px; }
  .empty-state p { font-size: 14px; }

  /* 患者情報ヘッダー */
  .patient-header {
    background: #f0f4fc;
    border: 1px solid #c0d0e8;
    border-radius: 6px;
    padding: 12px 16px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .patient-avatar {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: #00479e;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
  }
  .patient-name-big { font-size: 18px; font-weight: bold; }
  .patient-name-sub { font-size: 12px; color: #666; margin-top: 2px; }

  /* セクション */
  .section-title {
    font-size: 14px;
    font-weight: bold;
    color: #00479e;
    border-left: 4px solid #00479e;
    padding-left: 8px;
    margin: 20px 0 10px;
  }

  /* サマリーカード（受診ごと） */
  .summary-card {
    border: 1px solid #d0d8e8;
    border-radius: 8px;
    margin-bottom: 12px;
    overflow: hidden;
  }
  .summary-card-header {
    background: #e8f0fb;
    padding: 8px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 1px solid #c8d4e8;
  }
  .summary-card-header .date-badge {
    background: #00479e;
    color: #fff;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 12px;
    font-weight: bold;
  }
  .summary-card-header .hosp-name { font-weight: bold; font-size: 13px; }
  .summary-card-header .dept { color: #555; font-size: 12px; }
  .summary-card-header .type-badge {
    margin-left: auto;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 4px;
  }
  .type-badge.outpatient { background: #d4edda; color: #155724; }
  .type-badge.inpatient { background: #fff3cd; color: #856404; }

  .summary-card-body { padding: 12px 14px; }

  /* 傷病名 */
  .disease-list { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .disease-tag {
    font-size: 12px;
    padding: 3px 10px;
    border-radius: 12px;
    border: 1px solid;
  }
  .disease-tag.primary { background: #fde8e8; border-color: #e88; color: #a00; font-weight: bold; }
  .disease-tag.secondary { background: #f5f5f5; border-color: #ccc; color: #444; }

  /* 療養計画 */
  .advice-box {
    background: #fffde7;
    border: 1px solid #ffe082;
    border-radius: 6px;
    padding: 10px 12px;
    font-size: 13px;
    line-height: 1.7;
    white-space: pre-wrap;
    color: #333;
  }

  /* 医師情報 */
  .doctor-info { font-size: 11px; color: #666; margin-top: 6px; }

  /* テーブル */
  .info-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
    margin-bottom: 4px;
  }
  .info-table th {
    background: #f0f4fc;
    color: #334;
    text-align: left;
    padding: 6px 10px;
    border: 1px solid #d0d8e8;
    font-weight: bold;
    width: 160px;
  }
  .info-table td {
    padding: 6px 10px;
    border: 1px solid #d0d8e8;
    color: #222;
  }
  .info-table tr:nth-child(even) td { background: #f9fafc; }
  .result-normal { color: #1a7c1a; }
  .result-high { color: #c0392b; font-weight: bold; }
  .result-low { color: #2980b9; font-weight: bold; }

  /* アレルギー・感染症 */
  .allergy-tag {
    display: inline-block;
    background: #fde8e8;
    border: 1px solid #e88;
    color: #a00;
    font-size: 12px;
    padding: 3px 10px;
    border-radius: 12px;
    margin: 2px;
  }
  .infection-tag {
    display: inline-block;
    background: #fff3cd;
    border: 1px solid #ffc107;
    color: #856404;
    font-size: 12px;
    padding: 3px 10px;
    border-radius: 12px;
    margin: 2px;
  }
  .none-text { color: #aaa; font-size: 12px; font-style: italic; }

  /* 処方タグ */
  .rx-item {
    background: #f0f8ff;
    border: 1px solid #b0d0ef;
    border-radius: 6px;
    padding: 8px 12px;
    margin-bottom: 6px;
    font-size: 12px;
  }
  .rx-item .rx-name { font-weight: bold; color: #004a80; }
  .rx-item .rx-detail { color: #555; margin-top: 2px; }

  /* カウントバッジ */
  .count-badge {
    display: inline-block;
    background: #00479e;
    color: #fff;
    border-radius: 10px;
    font-size: 10px;
    padding: 1px 7px;
    margin-left: 6px;
    vertical-align: middle;
  }

  /* 範囲外メッセージ */
  .range-note {
    background: #f5f5f5;
    border: 1px dashed #ccc;
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 11px;
    color: #888;
    margin-top: 8px;
  }

  /* 凡例 */
  .legend {
    display: flex;
    gap: 16px;
    font-size: 11px;
    color: #666;
    margin-bottom: 12px;
  }
  .legend span { display: flex; align-items: center; gap: 4px; }
  .legend .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

  /* レスポンシブ */
  @media (max-width: 768px) {
    .layout { flex-direction: column; }
    .sidebar { width: 100%; min-width: unset; height: auto; border-right: none; border-bottom: 1px solid #d0d7e2; }
  }
</style>
</head>

<div class="app-header">

    <div class="sub">電子カルテ情報共有サービス（患者サマリー登録・閲覧サービス編）対応 ／ 参考：厚生労働省資料 R8.6 v1.0.1</div>
  </div>

      </div>
    </div>

    <div class="section">
      <label>受診履歴タイムライン</label>
      <div class="legend">
        <span><span class="dot in-range"></span>表示範囲内</span>

      </div>
      <div class="timeline" id="timeline"></div>

  <!-- ===== 右パネル ===== -->
  <div class="main">

  </div>
</div>

// ============================================================
//  ユーティリティ
// ============================================================
function parseDate(str) { return str ? new Date(str + 'T00:00:00') : null; }
function diffDays(a, b) { return Math.round((a - b) / 86400000); }
function formatDate(str) {
  if (!str) return '';
  const d = parseDate(str);
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
}
function flagClass(flag) {
  return flag === 'high' ? 'result-high' : flag === 'low' ? 'result-low' : 'result-normal';
}
function flagLabel(flag) {
  return flag === 'high' ? '↑' : flag === 'low' ? '↓' : '';
}

// ============================================================
//  State
// ============================================================
let currentPersonaId = null;
let currentDate = null;

// ============================================================
//  レンダリング
// ============================================================
function renderPersonaList() {
  const el = document.getElementById('persona-list');
  el.innerHTML = PERSONAS.map(p => `
    <div class="persona-card${p.id === currentPersonaId ? ' active' : ''}" onclick="selectPersona('${p.id}')">
      <div class="persona-name">${p.icon} ${p.name}</div>
      <div class="persona-meta">${p.age}歳 ${p.sex} ／ ${p.kana}</div>
      <div>${p.tags.map(t => `<span class="persona-tag">${t}</span>`).join('')}</div>
    </div>
  `).join('');
}

function renderTimeline(persona, viewingDate) {
  const el = document.getElementById('timeline');
  if (!persona) { el.innerHTML = ''; return; }
  const html = persona.visits.map(v => {
    const vd = parseDate(v.date);
    const inRange = viewingDate ? diffDays(viewingDate, vd) >= 0 && diffDays(viewingDate, vd) <= 180 : false;
    return `
      <div class="visit-dot">
        <div class="dot ${inRange ? 'in-range' : 'out-range'}"></div>
        <div>
          <div class="visit-date">${formatDate(v.date)} <span class="visit-label ${inRange ? 'in' : 'out'}">${inRange ? '表示' : '非表示'}</span></div>
          <div class="visit-hosp">${v.hospital} ／ ${v.dept}</div>
          <div style="font-size:10px;color:#888">${v.type} ／ ${v.diseases.map(d=>d.name).join('、')}</div>
        </div>
      </div>
    `;
  }).join('');
  el.innerHTML = html;
}

function renderPortal(persona, viewingDate) {
  const body = document.getElementById('portal-body');
  const topbarDate = document.getElementById('topbar-date');

  if (!persona || !viewingDate) {
    topbarDate.textContent = '';
    body.innerHTML = `
      <div class="empty-state">
        <div class="icon">👆</div>
        <p>左のパネルでペルソナと閲覧日を選択してください</p>
      </div>`;
    return;
  }

  topbarDate.textContent = `閲覧日：${formatDate(viewingDate.toISOString().split('T')[0])}`;

  // --- 表示対象の受診を絞り込む（閲覧日から過去180日以内）---
  const inRangeVisits = persona.visits.filter(v => {
    const vd = parseDate(v.date);
    const days = diffDays(viewingDate, vd);
    return days >= 0 && days <= 180;
  });

  let html = '';

  // 患者情報ヘッダー
  html += `
    <div class="patient-header">
      <div class="patient-avatar">${persona.icon}</div>
      <div>
        <div class="patient-name-big">${persona.name} 様</div>
        <div class="patient-name-sub">${persona.age}歳 ${persona.sex} ／ ${persona.kana}</div>
      </div>
    </div>
  `;

  // ===== 患者サマリー本体 =====
  html += `<div class="section-title">患者サマリー <span class="count-badge">${inRangeVisits.length}件</span></div>`;

  if (inRangeVisits.length === 0) {
    html += `
      <div class="range-note">
        閲覧日（${formatDate(viewingDate.toISOString().split('T')[0])}）から過去180日以内に登録された患者サマリーはありません。<br>
        ※患者サマリーがない場合、マイナポータルには何も表示されません（PDF仕様より）。
      </div>
    `;
  } else {
    inRangeVisits.forEach(v => {
      const guidanceDate = parseDate(v.date);
      const daysFromGuidance = diffDays(viewingDate, guidanceDate);

      // 検査・処方は指導日から過去30日以内のものを表示
      const showLabs = v.labs && v.labs.length > 0 && daysFromGuidance <= 30;
      const showRx = v.prescriptions && v.prescriptions.length > 0 && daysFromGuidance <= 30;

      html += `
        <div class="summary-card">
          <div class="summary-card-header">
            <span class="date-badge">指導日：${formatDate(v.date)}</span>
            <span class="hosp-name">${v.hospital}</span>
            <span class="dept">${v.dept} ／ ${v.doctor} 先生</span>
            <span class="type-badge ${v.type === '外来' ? 'outpatient' : 'inpatient'}">${v.type}</span>
          </div>
          <div class="summary-card-body">
            <div style="margin-bottom:8px">
              <div style="font-size:11px;color:#666;margin-bottom:4px">傷病名</div>
              <div class="disease-list">
                ${v.diseases.map(d =>
                  `<span class="disease-tag ${d.primary ? 'primary' : 'secondary'}">${d.primary ? '主傷病 ：' : '副傷病：'} ${d.name}</span>`
                ).join('')}
              </div>
            </div>
            <div style="margin-bottom:10px">
              <div style="font-size:11px;color:#666;margin-bottom:4px">療養上の計画・アドバイス</div>
              <div class="advice-box">${v.advice}</div>
            </div>
            ${showLabs ? `
              <div style="margin-bottom:10px">
                <div style="font-size:11px;color:#666;margin-bottom:4px">検査情報 <span style="color:#888">（指導日から30日以内に登録）</span></div>
                <table class="info-table">
                  <tr><th>検査項目</th><th>結果</th><th>単位</th><th>基準値</th></tr>
                  ${v.labs.map(l => `
                    <tr>
                      <td>${l.name}</td>
                      <td class="${flagClass(l.flag)}">${l.value} ${flagLabel(l.flag)}</td>
                      <td>${l.unit}</td>
                      <td>${l.ref}</td>
                    </tr>
                  `).join('')}
                </table>
              </div>
            ` : v.labs && v.labs.length > 0 ? `
              <div class="range-note">検査情報：指導日から31日以上経過のため非表示（30日ルール）</div>
            ` : ''}
            ${showRx ? `
              <div>
                <div style="font-size:11px;color:#666;margin-bottom:4px">処方情報 <span style="color:#888">（指導日から30日以内）</span></div>
                ${v.prescriptions.map(rx => `
                  <div class="rx-item">
                    <div class="rx-name">💊 ${rx.name}</div>
                    <div class="rx-detail">${rx.detail}</div>
                    ${rx.pharmacy ? `<div style="font-size:10px;color:#888;margin-top:2px">薬局：${rx.pharmacy}</div>` : ''}
                  </div>
                `).join('')}
              </div>
            ` : v.prescriptions && v.prescriptions.length > 0 ? `
              <div class="range-note">処方情報：指導日から31日以上経過のため非表示（30日ルール）</div>
            ` : ''}
            <div class="doctor-info">登録医師：${v.doctor}（${v.dept}）</div>
          </div>
        </div>
      `;
    });
  }

  // ===== アレルギー情報（全期間）=====
  html += `<div class="section-title">アレルギー情報 <span style="font-size:11px;font-weight:normal;color:#666">（全期間表示）</span></div>`;
  html += `<div style="margin-bottom:6px"><span style="font-size:12px;color:#666">薬剤アレルギー：</span>`;
  if (persona.drugAllergies.length > 0) {
    html += persona.drugAllergies.map(a => `<span class="allergy-tag">⚠ ${a}</span>`).join('');
  } else {
    html += `<span class="none-text">登録なし</span>`;
  }
  html += `</div>`;
  html += `<div><span style="font-size:12px;color:#666">その他アレルギー：</span>`;
  if (persona.otherAllergies.length > 0) {
    html += persona.otherAllergies.map(a => `<span class="allergy-tag">${a}</span>`).join('');
  } else {
    html += `<span class="none-text">登録なし</span>`;
  }
  html += `</div>`;

  // ===== 感染症情報（全期間）=====
  html += `<div class="section-title">感染症情報 <span style="font-size:11px;font-weight:normal;color:#666">（全期間表示）</span></div>`;
  if (persona.infections.length > 0) {
    html += persona.infections.map(inf => `
      <span class="infection-tag">🦠 ${inf.name}${inf.date ? '（' + formatDate(inf.date) + '）' : ''}</span>
    `).join('');
  } else {
    html += `<span class="none-text">登録なし</span>`;
  }

  // 範囲外の受診を表示（グレーアウト）
  const outVisits = persona.visits.filter(v => {
    const vd = parseDate(v.date);
    const days = diffDays(viewingDate, vd);
    return !(days >= 0 && days <= 180);
  });
  if (outVisits.length > 0) {
    html += `
      <div class="section-title" style="color:#999;border-color:#ccc">表示範囲外の受診履歴 <span class="count-badge" style="background:#aaa">${outVisits.length}件</span></div>
      <div class="range-note">
        以下の受診は閲覧日から180日より前のため、患者サマリーには表示されません。<br>
        ${outVisits.map(v => `・${formatDate(v.date)} ／ ${v.hospital} ／ ${v.diseases.map(d=>d.name).join('、')}`).join('<br>')}
      </div>
    `;
  }

  body.innerHTML = html;
}

// ============================================================
//  イベントハンドラ
// ============================================================
function selectPersona(id) {
  currentPersonaId = id;
  renderPersonaList();
  update();
}

function update() {
  const persona = PERSONAS.find(p => p.id === currentPersonaId) || null;
  const dateStr = document.getElementById('viewing-date').value;
  currentDate = dateStr ? parseDate(dateStr) : null;
  renderTimeline(persona, currentDate);
  renderPortal(persona, currentDate);
}

// ============================================================
//  初期化
// ============================================================
window.onload = () => {
  // デフォルト：今日の日付
  const today = new Date();
  const yyyy = today.getFullYear();
  const mm = String(today.getMonth()+1).padStart(2,'0');
  const dd = String(today.getDate()).padStart(2,'0');
  document.getElementById('viewing-date').value = `${yyyy}-${mm}-${dd}`;
  document.getElementById('viewing-date').addEventListener('change', update);

  renderPersonaList();
};
</script>
