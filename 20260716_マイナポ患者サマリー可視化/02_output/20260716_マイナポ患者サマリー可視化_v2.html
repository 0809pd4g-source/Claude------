<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>マイナポータル 患者サマリー シミュレーター</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Meiryo UI','メイリオ',sans-serif; background: #e8edf5; color: #222; font-size: 14px; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

/* ===== アプリヘッダー ===== */
.app-header {
  background: #003f8a; color: #fff;
  padding: 8px 16px; display: flex; align-items: center; gap: 10px; flex-shrink: 0;
}
.app-header .title { font-size: 14px; font-weight: bold; }
.app-header .sub { font-size: 10px; opacity: .7; }
.sim-badge { margin-left:auto; background:#e65c00; padding:2px 8px; border-radius:3px; font-size:10px; font-weight:bold; }

/* ===== メインレイアウト ===== */
.layout { display: flex; flex: 1; overflow: hidden; }

/* ===== 左パネル ===== */
.sidebar {
  width: 260px; min-width: 260px;
  background: #fff; border-right: 1px solid #cdd5e0;
  overflow-y: auto; padding: 14px 12px;
}
.sb-section { margin-bottom: 18px; }
.sb-label { font-size: 11px; font-weight: bold; color: #003f8a; margin-bottom: 6px; border-bottom: 1.5px solid #003f8a; padding-bottom: 3px; }

.persona-card {
  border: 1.5px solid #d5dce8; border-radius: 7px;
  padding: 8px 10px; margin-bottom: 6px; cursor: pointer;
  background: #fafbfc; transition: all .15s;
}
.persona-card:hover { border-color: #003f8a; background: #eef3fc; }
.persona-card.active { border-color: #003f8a; background: #dce8f8; }
.pc-name { font-weight: bold; font-size: 12px; }
.pc-meta { font-size: 10px; color: #666; margin-top: 2px; }
.pc-tags { margin-top: 4px; }
.pc-tag { display:inline-block; background:#e0ecff; color:#003f8a; font-size:10px; padding:1px 6px; border-radius:8px; margin:1px; }

input[type="date"] {
  width:100%; padding:6px 8px; border:1px solid #ccd3de;
  border-radius:5px; font-family:inherit; font-size:12px; color:#222;
}
input[type="date"]:focus { outline:none; border-color:#003f8a; }

.filter-box {
  background:#f3f6fc; border:1px solid #d0d9ec; border-radius:5px;
  padding:8px 10px; font-size:10px; color:#444; line-height:1.8;
}
.filter-box strong { color:#003f8a; }

/* タイムライン */
.tl-item { display:flex; align-items:flex-start; gap:7px; margin-bottom:7px; font-size:10px; }
.tl-dot { width:9px; height:9px; border-radius:50%; margin-top:2px; flex-shrink:0; }
.tl-dot.on { background:#00a040; }
.tl-dot.off { background:#bbb; }
.tl-badge { font-size:9px; padding:1px 5px; border-radius:3px; margin-left:3px; }
.tl-badge.on { background:#d4edda; color:#155724; }
.tl-badge.off { background:#eee; color:#888; }

/* ===== 右エリア（スマホフレーム） ===== */
.phone-area {
  flex: 1; display: flex; align-items: flex-start;
  justify-content: center; overflow-y: auto; padding: 20px;
  gap: 20px;
}

/* スマホフレーム */
.phone {
  width: 375px; min-width: 375px;
  background: #fff; border-radius: 36px;
  border: 10px solid #1a1a1a;
  box-shadow: 0 8px 32px rgba(0,0,0,.25);
  overflow: hidden; position: relative;
  height: 720px; display: flex; flex-direction: column;
}
.phone-notch {
  background: #1a1a1a; height: 28px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.phone-notch .notch-pill { background: #333; width: 80px; height: 12px; border-radius: 6px; }
.phone-status { background: #fff; padding: 4px 16px; display:flex; justify-content:space-between; font-size:10px; color:#333; flex-shrink:0; font-weight:bold; }

/* スマホ内スクロール */
.phone-screen { flex:1; overflow-y:auto; }

/* マイナポータルUI ===== */
.mp-nav {
  background:#fff; border-bottom:1px solid #e0e0e0;
  padding:10px 14px; display:flex; align-items:center; gap:8px; position:sticky; top:0; z-index:10;
}
.mp-nav .hamburger { font-size:18px; color:#003f8a; }
.mp-nav .logo { font-size:13px; font-weight:bold; color:#003f8a; flex:1; }
.mp-nav .bell { font-size:18px; color:#555; }

/* 画面A：一覧 */
.screen { display:none; }
.screen.active { display:block; }

.screen-a { padding: 0 0 20px; }

.hero-section {
  background: linear-gradient(135deg, #003f8a 0%, #0056c0 100%);
  color: #fff; padding: 16px 16px 14px;
}
.hero-section .label { font-size:10px; opacity:.8; margin-bottom:4px; }
.hero-section .big-title { font-size:22px; font-weight:bold; line-height:1.2; }
.hero-section .desc { font-size:10px; opacity:.75; margin-top:6px; line-height:1.5; }

.visit-list { padding: 0 12px; margin-top: 12px; }
.visit-card {
  border: 1px solid #dde4ef; border-radius: 10px;
  padding: 10px 12px; margin-bottom: 8px;
  background: #fff; cursor: pointer;
  display: flex; align-items: center; gap: 8px;
  box-shadow: 0 1px 4px rgba(0,0,0,.06); transition: box-shadow .15s;
}
.visit-card:hover { box-shadow: 0 2px 10px rgba(0,63,138,.15); border-color: #003f8a; }
.visit-card .vc-date { font-size:10px; color:#888; flex-shrink:0; width:72px; }
.vc-info { flex:1; }
.vc-hosp { font-size:12px; font-weight:bold; color:#222; }
.vc-dept { font-size:10px; color:#666; margin-top:1px; }
.vc-arrow { color:#999; font-size:14px; flex-shrink:0; }

.profile-section { padding: 12px 12px 0; margin-top: 4px; }
.ps-title { font-size:12px; font-weight:bold; color:#333; display:flex; align-items:center; justify-content:space-between; cursor:pointer; padding:8px 0; border-bottom:1px solid #eee; }
.ps-tags { margin-top:8px; display:flex; flex-wrap:wrap; gap:4px; }
.allergy-tag-mp { font-size:10px; padding:3px 10px; border-radius:10px; }
.allergy-tag-mp.drug { background:#ffe8e8; color:#c00; border:1px solid #f5a0a0; }
.allergy-tag-mp.other { background:#fff3cd; color:#7a5800; border:1px solid #ffc107; }
.allergy-tag-mp.inf { background:#e8f5e9; color:#1b5e20; border:1px solid #81c784; }

.accordion-section { padding: 0 12px; }
.acc-header {
  background:#f5f7fc; border:1px solid #e0e6f0; border-radius:8px;
  padding:10px 12px; margin-bottom:6px; display:flex;
  align-items:center; cursor:pointer; margin-top:8px;
}
.acc-icon { font-size:14px; margin-right:6px; }
.acc-label { font-size:12px; font-weight:bold; flex:1; }
.acc-count { background:#003f8a; color:#fff; font-size:10px; padding:1px 7px; border-radius:8px; margin-right:6px; }
.acc-chevron { color:#999; font-size:12px; transition:transform .2s; }
.acc-chevron.open { transform: rotate(180deg); }
.acc-body { border:1px solid #e0e6f0; border-top:none; border-radius:0 0 8px 8px; overflow:hidden; display:none; }
.acc-body.open { display:block; }
.acc-row { padding:8px 12px; border-bottom:1px solid #f0f0f0; font-size:11px; display:flex; align-items:center; justify-content:space-between; }
.acc-row:last-child { border-bottom:none; }
.acc-row-name { font-weight:bold; }
.acc-row-detail { color:#555; font-size:10px; }
.acc-row-arrow { color:#ccc; }

/* 画面B：詳細 */
.screen-b { padding: 0 0 20px; }
.back-bar {
  padding: 8px 14px; display:flex; align-items:center; gap:6px;
  cursor:pointer; color:#003f8a; font-size:12px; font-weight:bold;
  border-bottom:1px solid #eee; background:#fafbfc;
}
.detail-body { padding: 14px 14px; }
.detail-date { font-size:22px; font-weight:bold; color:#222; margin-bottom:4px; }
.detail-hosp { font-size:12px; color:#555; margin-bottom:2px; }
.detail-doctor { font-size:11px; color:#888; margin-bottom:16px; }

.detail-section-title { font-size:13px; font-weight:bold; color:#333; margin-bottom:8px; padding-top:14px; border-top:1px solid #eee; }
.disease-block { margin-bottom:6px; }
.disease-role { font-size:10px; color:#888; margin-bottom:2px; }
.disease-name-main { font-size:14px; font-weight:bold; color:#222; }
.disease-name-sub { font-size:12px; color:#555; margin-left:4px; }

.advice-text { font-size:12px; line-height:1.8; color:#333; white-space:pre-wrap; background:#fffde7; border-left:3px solid #ffc107; padding:10px 12px; border-radius:0 6px 6px 0; }

/* 処方・検査への誘導 */
.goto-links { padding:12px; display:flex; gap:8px; flex-direction:column; }
.goto-btn {
  background:#fff; border:1.5px solid #003f8a; border-radius:10px;
  padding:12px 14px; display:flex; align-items:center; gap:10px;
  cursor:pointer; color:#003f8a; font-size:13px; font-weight:bold;
  box-shadow:0 1px 4px rgba(0,0,0,.06); transition:background .15s;
}
.goto-btn:hover { background:#eef3fc; }
.goto-btn .gb-icon { font-size:20px; }
.goto-btn .gb-count { margin-left:auto; background:#003f8a; color:#fff; font-size:10px; padding:2px 8px; border-radius:8px; }
.goto-btn .gb-arrow { color:#003f8a; margin-left:4px; }
.goto-btn.disabled { border-color:#ccc; color:#aaa; cursor:default; }
.goto-btn.disabled .gb-icon { opacity:.4; }

/* 画面C：処方情報 */
.screen-c { padding:0 0 20px; }
.rx-date-head { font-size:12px; font-weight:bold; color:#555; padding:10px 14px 4px; }
.rx-card {
  margin:0 12px 8px; border:1px solid #c8dff5; border-radius:8px;
  overflow:hidden; background:#fff;
}
.rx-card-header {
  background:#e8f0fb; padding:8px 12px; font-size:11px;
  color:#003f8a; font-weight:bold; display:flex; align-items:center; gap:6px;
  cursor:pointer; justify-content:space-between;
}
.rx-card-body { padding:10px 12px; font-size:11px; }
.rx-name { font-weight:bold; color:#003f8a; margin-bottom:2px; }
.rx-detail { color:#444; font-size:10px; }
.rx-note { color:#888; font-size:10px; margin-top:2px; }

/* 画面D：検査結果 */
.screen-d { padding:0 0 20px; }
.lab-date-head { font-size:12px; font-weight:bold; color:#555; padding:10px 14px 4px; }
.lab-table { width:100%; border-collapse:collapse; font-size:11px; margin:0 0 12px; }
.lab-table th { background:#f0f4fc; color:#334; padding:5px 8px; text-align:left; border-bottom:1px solid #dde4ef; }
.lab-row { border-bottom:1px solid #f0f2f7; }
.lab-row td { padding:7px 8px; vertical-align:top; }
.lab-name { font-size:11px; color:#222; display:flex; align-items:center; gap:4px; }
.lab-info { font-size:9px; color:#888; }
.lab-value { font-size:13px; font-weight:bold; }
.lab-unit { font-size:9px; color:#666; }
.lab-ref { font-size:9px; color:#888; }
.val-high { color:#c0392b; }
.val-low { color:#2471a3; }
.val-normal { color:#229954; }
.flag-badge { font-size:9px; padding:1px 4px; border-radius:3px; }
.flag-badge.H { background:#fde8e8; color:#c00; }
.flag-badge.L { background:#e8f0fe; color:#1a5276; }
.flag-badge.unkown { background:#f5f5f5; color:#888; }

/* スクリーンタイトルバー */
.screen-titlebar {
  background:#fff; border-bottom:1px solid #eee;
  padding:10px 14px; display:flex; align-items:center; gap:8px;
  position:sticky; top:0; z-index:10;
}
.stb-back { color:#003f8a; cursor:pointer; font-size:18px; }
.stb-title { font-size:13px; font-weight:bold; color:#222; }
.stb-count { background:#003f8a; color:#fff; font-size:10px; padding:1px 7px; border-radius:8px; margin-left:4px; }

/* 空状態 */
.empty-phone {
  display:flex; flex-direction:column; align-items:center;
  justify-content:center; height:80%; color:#aaa; gap:8px;
}
.empty-phone .ei { font-size:36px; }
.empty-phone p { font-size:12px; text-align:center; line-height:1.6; }

/* 範囲外バナー */
.out-banner {
  background:#fff3cd; border-left:3px solid #ffc107;
  margin:10px 12px; padding:8px 10px; border-radius:0 6px 6px 0;
  font-size:10px; color:#856404;
}
</style>
</head>

// ===================================================================
//  ユーティリティ
// ===================================================================
function pd(str) { return str ? new Date(str + 'T00:00:00') : null; }
function diffDays(a, b) { return Math.round((a - b) / 86400000); }
function fmtDate(str) {
  if (!str) return '';
  const d = pd(str);
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
}
function fmtDateShort(str) {
  if (!str) return '';
  const d = pd(str);
  return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`;
}

// ===================================================================
//  State
// ===================================================================
let state = {
  personaId: null,
  viewingDate: null,
  screen: 'A',      // A=一覧 B=詳細 C=処方 D=検査
  visitIdx: null,   // 詳細表示中の受診インデックス（inRange内）
};

function persona() { return PERSONAS.find(p => p.id === state.personaId) || null; }

// 閲覧日から180日以内の受診
function inRangeVisits() {
  const p = persona(); if (!p || !state.viewingDate) return [];
  return p.visits.filter(v => {
    const days = diffDays(state.viewingDate, pd(v.date));
    return days >= 0 && days <= 180;
  });
}

// 指定受診の検査が表示対象か（指導日から30日以内）
function labsVisible(visit) {
  if (!state.viewingDate) return false;
  return diffDays(state.viewingDate, pd(visit.date)) <= 30;
}

// ===================================================================
//  左パネル描画
// ===================================================================
function renderSidebar() {
  // ペルソナ
  document.getElementById('persona-list').innerHTML = PERSONAS.map(p => `
    <div class="persona-card${p.id === state.personaId ? ' active' : ''}" onclick="selectPersona('${p.id}')">
      <div class="pc-name">${p.icon} ${p.name}</div>
      <div class="pc-meta">${p.age}歳 ${p.sex}</div>
      <div class="pc-tags">${p.tags.map(t=>`<span class="pc-tag">${t}</span>`).join('')}</div>
    </div>
  `).join('');

  // タイムライン
  const p = persona();
  const tl = document.getElementById('timeline');
  if (!p) { tl.innerHTML=''; return; }
  tl.innerHTML = p.visits.map(v => {
    const on = state.viewingDate && diffDays(state.viewingDate, pd(v.date)) >= 0 && diffDays(state.viewingDate, pd(v.date)) <= 180;
    return `
      <div class="tl-item">
        <div class="tl-dot ${on?'on':'off'}"></div>
        <div>
          <div>${fmtDateShort(v.date)}<span class="tl-badge ${on?'on':'off'}">${on?'表示':'非表示'}</span></div>
          <div style="color:#555">${v.hospital}</div>
          <div style="color:#888;font-size:9px">${v.diseases.map(d=>d.name).join('・')}</div>
        </div>
      </div>`;
  }).join('');
}

// ===================================================================
//  スマホ画面描画
// ===================================================================
function renderPhone() {
  const screen = document.getElementById('phone-screen');
  const p = persona();

  if (!p || !state.viewingDate) {
    screen.innerHTML = `
      <div class="empty-phone">
        <div class="ei">👆</div>
        <p>ペルソナと閲覧日を<br>選択してください</p>
      </div>`;
    return;
  }

  if (state.screen === 'A') renderScreenA(screen, p);
  else if (state.screen === 'B') renderScreenB(screen, p);
  else if (state.screen === 'C') renderScreenC(screen, p);
  else if (state.screen === 'D') renderScreenD(screen, p);
}

// ===== 画面A：患者サマリー一覧 =====

  const allRx = all.flatMap(v => {
    if (!labsVisible(v)) return [];
    return v.prescriptions || [];
  });
  const allLabs = all.flatMap(v => {
    if (!labsVisible(v)) return [];
    return v.labs || [];
  });

  screen.innerHTML = `
    <div class="screen-a">
      <div class="mp-nav">
        <span class="hamburger">☰</span>
        <span class="logo">マイナポータル</span>
        <span class="bell">🔔</span>
      </div>
      <div class="hero-section">
        <div class="label">患者サマリー</div>
        <div class="big-title">療養上のアドバイス</div>
        <div class="desc">医療機関に記録された傷病をもとに関わる療養上の計画・アドバイスおよび臨床情報（処方、検査等）の要約</div>
      </div>

      ${outCount > 0 ? `<div class="out-banner">※ 過去180日より前の受診 ${outCount}件 は表示対象外です</div>` : ''}

      <div class="visit-list">${visitCards}</div>

          ${hasAllergy ? (da + oa + inf) : '<span style="font-size:10px;color:#aaa">登録なし</span>'}
        </div>
        <div style="padding-left:8px;margin-bottom:4px">
          <span class="allergy-tag-mp drug" style="font-size:9px;cursor:default">アレルギー等</span>
          <span class="allergy-tag-mp inf" style="font-size:9px;margin-left:4px;cursor:default">感染症</span>
        </div>
      </div>

      <div class="accordion-section">
        <div class="acc-header" onclick="toggleAcc('rx')">
          <span class="acc-icon">💊</span>
          <span class="acc-label">薬剤</span>
          <span class="acc-count">${allRx.length}件</span>
          <span class="acc-chevron" id="rx-chev">▼</span>
        </div>
        <div class="acc-body" id="rx-acc">
          ${allRx.length === 0
            ? '<div class="acc-row"><span class="acc-row-detail">表示対象の処方情報がありません（30日ルール）</span></div>'
            : allRx.map(rx => `
              <div class="acc-row">
                <div>
                  <div class="acc-row-name">${rx.name}</div>
                  <div class="acc-row-detail">${rx.detail}</div>

        <div class="acc-header" onclick="toggleAcc('other')">
          <span class="acc-icon">🥜</span>
          <span class="acc-label">その他</span>
          <span class="acc-count">${p.allergies.other.length}件</span>
          <span class="acc-chevron" id="other-chev">▼</span>

                <span class="acc-row-arrow">›</span>

}

      </table>

// ===================================================================
//  アコーディオン
// ===================================================================
function toggleAcc(id) {
  const body = document.getElementById(id+'-acc') || document.getElementById(id+'-body');
  const chev = document.getElementById(id+'-chev');
  if (!body) return;
  const open = body.style.display !== 'none' && body.style.display !== '';
  body.style.display = open ? 'none' : '';
  if (chev) { chev.textContent = open ? '▼' : '▲'; chev.classList.toggle('open', !open); }
}

function toggleRx(i) {
  const body = document.getElementById('rx-body-'+i);
  const chev = document.getElementById('rx-chev-'+i);
  const open = body.style.display !== 'none';
  body.style.display = open ? 'none' : 'block';
  if (chev) chev.textContent = open ? '▼' : '▲';
}

// ===================================================================
//  画面遷移
// ===================================================================
function goDetail(idx) {
  state.visitIdx = idx;
  state.screen = 'B';
  renderPhone();
  document.getElementById('phone-screen').scrollTop = 0;
}
function goScreen(s) {
  state.screen = s;
  renderPhone();
  document.getElementById('phone-screen').scrollTop = 0;
}
function goBack(s) {
  state.screen = s;
  renderPhone();
  document.getElementById('phone-screen').scrollTop = 0;
}

// ===================================================================
//  メイン更新
// ===================================================================
function selectPersona(id) {
  state.personaId = id;
  state.screen = 'A';
  state.visitIdx = null;
  update();
}
function update() {
  const dateStr = document.getElementById('viewing-date').value;
  state.viewingDate = dateStr ? pd(dateStr) : null;
  renderSidebar();
  renderPhone();
}

// ===================================================================
//  初期化
// ===================================================================
window.onload = () => {
  const today = new Date();
  const s = d => String(d).padStart(2,'0');
  document.getElementById('viewing-date').value =
    `${today.getFullYear()}-${s(today.getMonth()+1)}-${s(today.getDate())}`;
  document.getElementById('viewing-date').addEventListener('change', update);
  renderSidebar();
};
