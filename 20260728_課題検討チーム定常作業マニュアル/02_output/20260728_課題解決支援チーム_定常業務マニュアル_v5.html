<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>課題解決支援チーム 定常業務マニュアル</title>
<style>
:root{--sb:272px;--pri:#1a2e4a;--acc:#2563eb;--txt:#1f2937;--mu:#6b7280;--bd:#e5e7eb;--bg:#f9fafb}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Hiragino Sans','Yu Gothic',Meiryo,sans-serif;font-size:14px;color:var(--txt);background:var(--bg);display:flex;height:100vh;overflow:hidden}
/* ─ Sidebar */
#sb{width:var(--sb);min-width:var(--sb);background:var(--pri);color:#fff;display:flex;flex-direction:column;height:100vh;overflow:hidden}
#sb-hd{padding:14px 12px 10px;border-bottom:1px solid rgba(255,255,255,.12)}
#sb-tag{font-size:9.5px;font-weight:700;letter-spacing:.1em;color:rgba(255,255,255,.45);text-transform:uppercase}
#sb-ttl{font-size:12.5px;font-weight:700;color:#fff;margin-top:4px;line-height:1.5}
#sb-srch{padding:8px 10px;border-bottom:1px solid rgba(255,255,255,.1)}
#srch-in{width:100%;padding:5px 8px;border-radius:5px;border:none;background:rgba(255,255,255,.15);color:#fff;font-size:12px;outline:none}
#srch-in::placeholder{color:rgba(255,255,255,.4)}
#srch-in:focus{background:rgba(255,255,255,.22)}
#nav{flex:1;overflow-y:auto;padding:4px 0 12px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.15) transparent}
/* ─ Category headers */
.cat-hd{padding:10px 10px 4px;display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none}
.cat-hd:hover{background:rgba(255,255,255,.05)}
.cat-cadence{font-size:9px;padding:1px 5px;border-radius:10px;font-weight:700;white-space:nowrap;background:rgba(255,255,255,.18);color:rgba(255,255,255,.8)}
.cat-cadence.月次{background:rgba(217,119,6,.4);color:#fde68a}
.cat-cadence.随時{background:rgba(107,114,128,.4);color:#d1d5db}
.cat-name{font-size:10.5px;font-weight:700;color:rgba(255,255,255,.7);flex:1;line-height:1.3}
.cat-arrow{font-size:9px;color:rgba(255,255,255,.3);transition:transform .15s}
.cat-hd.collapsed .cat-arrow{transform:rotate(-90deg)}
.cat-body{overflow:hidden}
.cat-body.collapsed{display:none}
/* ─ Nav items */
.ni{display:flex;align-items:flex-start;gap:5px;padding:5px 10px 5px 20px;cursor:pointer;font-size:11px;line-height:1.4;color:rgba(255,255,255,.65);border-left:3px solid transparent;transition:background .1s}
.ni:hover{background:rgba(255,255,255,.08);color:#fff}
.ni.active{background:rgba(255,255,255,.12);color:#fff;border-left-color:#60a5fa}
.ni-bd{font-size:8.5px;padding:1px 4px;border-radius:3px;font-weight:700;white-space:nowrap;flex-shrink:0;margin-top:2px}
.bd-手順{background:rgba(96,165,250,.3);color:#bfdbfe}
.bd-メモ{background:rgba(52,211,153,.3);color:#a7f3d0}
.bd-台帳{background:rgba(251,191,36,.3);color:#fde68a}
.bd-参考{background:rgba(156,163,175,.3);color:#d1d5db}
.ni-tx{flex:1}
/* ─ Main */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden}
#topbar{background:#fff;border-bottom:1px solid var(--bd);padding:8px 20px;display:flex;align-items:center;gap:8px;min-height:42px}
#cur-ttl{font-size:13px;font-weight:600;color:var(--pri);flex:1}
.tb-btn{padding:3px 10px;font-size:11px;border-radius:4px;border:1px solid var(--bd);background:#fff;cursor:pointer;color:var(--txt)}
.tb-btn:hover{background:var(--bg)}
#ca{flex:1;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#d1d5db transparent}
/* ─ Section */
.sec{display:none;padding:22px 28px 48px;max-width:840px}
.sec.active{display:block}
.sec-meta{display:flex;align-items:center;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.sec-cat-tag{font-size:10px;padding:2px 7px;border-radius:3px;font-weight:700;color:#fff}
.sec-cadence{font-size:10px;padding:2px 7px;border-radius:3px;font-weight:700;border:1px solid var(--bd);color:var(--mu)}
.sec-cadence.週次{background:#eff6ff;color:#1e40af;border-color:#bfdbfe}
.sec-cadence.月次{background:#fffbeb;color:#92400e;border-color:#fde68a}
.sec-cadence.随時{background:#f3f4f6;color:#374151;border-color:#d1d5db}
.sec-type{font-size:10px;padding:2px 7px;border-radius:3px;font-weight:700}
.sec-type.手順{background:#dbeafe;color:#1e40af}
.sec-type.メモ{background:#d1fae5;color:#065f46}
.sec-type.台帳{background:#fef3c7;color:#92400e}
.sec-type.参考{background:#f3f4f6;color:#374151}
.tgt{font-size:11px;color:var(--mu);background:var(--bg);padding:2px 7px;border-radius:4px;border:1px solid var(--bd)}
.upd{font-size:11px;color:var(--mu);margin-left:auto}
.sec-h1{font-size:18px;font-weight:700;color:var(--pri);margin-bottom:18px;line-height:1.35}
/* ─ Content body */
.cb h2{font-size:14px;font-weight:700;color:var(--pri);margin:22px 0 8px;padding-bottom:5px;border-bottom:2px solid #dbeafe}
.cb h2:first-child{margin-top:0}
.cb h3{font-size:12.5px;font-weight:700;color:#1e40af;margin:12px 0 5px;padding:5px 9px;background:#eff6ff;border-radius:4px;border-left:3px solid #3b82f6}
.cb p{margin:3px 0;line-height:1.75;color:#374151}
.cb ul.lns{list-style:none;margin:3px 0 8px;padding:0}
.cb ul.lns li{padding:2px 0 2px 12px;line-height:1.65;color:#374151;position:relative}
.cb ul.lns li::before{content:'·';position:absolute;left:3px;color:var(--mu)}
.chk{display:flex;align-items:flex-start;gap:7px;padding:3px 0}
.chk input{margin-top:2px;width:14px;height:14px;flex-shrink:0;accent-color:#3b82f6;cursor:pointer}
.chk label{cursor:pointer;color:#374151;line-height:1.6;flex:1}
.chk input:checked+label{color:#9ca3af;text-decoration:line-through}
.wrn{background:#fef2f2;border:1px solid #fecaca;border-radius:5px;padding:6px 10px;margin:4px 0;color:#991b1b;font-size:13px;line-height:1.65}
.nt{color:var(--mu);font-size:12px;padding:2px 0 2px 10px;border-left:2px solid var(--bd);margin:3px 0;line-height:1.6}
.fr{font-size:12px;background:#eff6ff;color:#1e40af;padding:1px 4px;border-radius:3px;font-family:monospace}
.bun{background:#f8fafc;border:1px solid var(--bd);border-left:3px solid #94a3b8;border-radius:5px;padding:10px 12px;margin:8px 0;font-size:12.5px;line-height:1.85;white-space:pre-wrap}
.empty-sec{color:var(--mu);font-size:13px;padding:12px;border:1px dashed var(--bd);border-radius:5px;text-align:center}
/* ─ Welcome / Search */
#welcome{padding:40px 32px;color:var(--mu)}
#welcome h2{font-size:18px;color:var(--pri);margin-bottom:12px}
#srch-res{display:none;padding:20px 28px}
.sr-item{padding:12px;margin-bottom:8px;background:#fff;border:1px solid var(--bd);border-radius:6px;cursor:pointer}
.sr-item:hover{border-color:#93c5fd}
.sr-sec{font-size:11px;color:var(--mu);margin-bottom:4px}
.sr-txt{font-size:13px;color:var(--txt);line-height:1.5}
#view-toggle{display:flex;padding:6px 8px;gap:4px;border-bottom:1px solid rgba(255,255,255,.1)}
.vt-btn{flex:1;padding:4px 6px;font-size:11px;font-weight:600;border-radius:4px;border:1px solid rgba(255,255,255,.2);background:transparent;color:rgba(255,255,255,.55);cursor:pointer;transition:all .15s}
.vt-btn:hover{background:rgba(255,255,255,.1);color:#fff}
.vt-btn.active-view{background:rgba(255,255,255,.2);color:#fff;border-color:rgba(255,255,255,.35)}
@media print{body{overflow:visible;display:block}#sb{display:none}#main{overflow:visible}#topbar{display:none}#ca{overflow:visible}.sec{display:block!important;page-break-before:always}.sec:first-child{page-break-before:auto}}
</style>
</head>
<body>
<nav id="sb">
  <div id="sb-hd">
    <div id="sb-tag">課題解決支援チーム</div>
    <div id="sb-ttl">定常業務<br>マニュアル</div>
  </div>
  <div id="view-toggle">
    <button id="btn-meeting" class="vt-btn active-view" onclick="switchView('meeting')">会議別</button>
    <button id="btn-task" class="vt-btn" onclick="switchView('task')">作業別</button>
  </div>
  <div id="sb-srch">
    <input type="text" id="srch-in" placeholder="🔍 検索..." oninput="doSearch(this.value)">
  </div>
  <div id="nav"></div>
</nav>
<main id="main">
  <div id="topbar">
    <span id="cur-ttl">セクションを選択してください</span>
    <button class="tb-btn" onclick="window.print()">🖨 印刷</button>
    <button class="tb-btn" onclick="resetAll()">☑ リセット</button>
  </div>
  <div id="ca">
    <div id="welcome">
      <h2>課題解決支援チーム 定常業務マニュアル</h2>
      <p>左のメニューからカテゴリ・セクションを選択するか、検索をご利用ください。<br>チェックリストの状態はブラウザに保存されます。</p>
    </div>
    <div id="sc"></div>
    <div id="srch-res"></div>
  </div>
</main>
<script>
const SECS = [{"id": "s1", "type": "手順", "title": "会議参加・議事メモ作成", "target": "進捗連絡会議（月 13:30）／課題検討会（月 14:00）", "cadence": "週次", "m_cat": "m_cat1", "t_cat": "t_cat1", "content": "## 概要\n月曜日開催の進捗連絡会議・課題検討会に参加し、議事メモを作成・アップロードする。\n目的：言った言わないを防ぐ ／ 議事要旨作成のインプットとする\n作業担当\n入館証受け取り・ポケットWiFi・会場設営・議事メモ作成：中里、崎坂\n議事要旨作成：中里、崎坂\n## 持ち物チェック\n☐ ポケットWiFi（PMOデスク上のもの）\n☐ ACN社員証\n☐ PC\n☐ PCの充電器\n※ 基金からテザリング禁止の指示あり。必ずポケットWiFiを持参すること。\n## 手順\n### 1. 出発（会議開始30分前 ＝ 通常13:00）\n山口ビルを皆で出発する。\n### 2. 厚労省到着：入館証受け取り\n道中で入館証が必要な人数を把握する。\n基金・基金ACN合わせた人数を確認（できれば、櫻井さんに事前確認）。\n先に到着している人・遅れて向かっている人を考慮する。\n厚労省入館後、左手の受付へ向かう。\n「アクセンチュア 櫻井で予約しております」と伝え、ACN入館証を提示する。\n電話番号を聞かれたら自分の番号を伝える。\n入館証を受け取り、全員に配布する。\n### 3. 会議室設営\nポケットWiFiをONにする。\nマイクの設定は厚労省担当者に一任する（ネットワーク機器の設定管理のため）。\n### 4. 会議中：議事メモ作成\n事前にフォーマット・議題を準備しておく。\n録音を開始する。\n開始後10秒ほどで録音されているか確認する。\nWindowsの「サウンドレコーダー」などの標準録音ソフトを使用する。Jabra接続時は音量ミュート設定により録音不可になる場合があるため注意。\n録音はunofficial扱い。\n質疑パートのみメモを集中して取る。\n説明パートでは直前議題の合意事項・ToDoを整理しておく。\n聞き漏れがあった箇所にはCtrl+4などで印をつけ、後から録音で確認できる状態にする。\nToDo・決定事項を書き漏れなく拾う。\n### 5. 会議後：アップロード\n疑問点など雑なメモを整理する。\n共有OneNoteの適切な場所（前回分の真下）にアップロードする。\n課題検討会：[OneNoteリンクをここに貼る]\n進捗連絡会議：[OneNoteリンクをここに貼る]\n## セルフレビュー\n### 会議前\n☐ 議事メモのフォーマットを準備してあるか\n☐ 録音ソフトの準備は良いか\n☐ ポケットWiFiを持ったか\n☐ ACN入館証を持ったか\n### 会議中\n☐ （開始10秒後）録音が入っているか確認したか\n☐ ToDo・決定事項を拾えているか\n☐ 聞き漏れ箇所に印（Ctrl+4など）をつけているか\n### 会議後\n☐ 疑問点など雑なメモを落としたか\n☐ 適切な場所にアップロードできたか（前回分の真下か）\n## 補足・ポイント\n質疑部分だけメモすれば基本OK。説明パート中は合意事項・ToDoの整理に集中する。\n充電器は必ず持参（会議が長引くと充電切れのリスクあり）。\nよく話す方は変換登録しておくとメモが速くなる。\n例：（支払基金 宮脇）→「みや」、（基金 山本(晃)）→「やま」、（ACN 櫻井）→「さく」、（ACN 向井）→「むか」、（厚労省 高橋）→「たか」", "updated": "2026-07-28", "author": "中澤"}, {"id": "s2", "type": "手順", "title": "開催時間変更時の対応", "target": "進捗連絡会議（月 13:30）／課題検討会（月 14:00）", "cadence": "随時", "m_cat": "m_cat1", "t_cat": "t_cat6", "content": "## 概要\n進捗連絡会議または課題検討会の開催時間が変更になった場合に、関係する連絡・資料の時間を更新する。\n※ 進捗連絡会議が延びて課題検討会が遅く始まり定刻に終わる場合は、Invの変更不要。\n## 対応箇所一覧\n### 1. Inv（カレンダー招待）\n進捗連絡会議の開始時間、または課題検討会の終了時間が変わった場合のみ更新する。\n### 2. 開催連絡（厚労Teams）\n### 3. 資料内の時間表記\n### 4. 連絡系統\n※ 連絡先：中西さん（厚労Teams【ロジ関連】スレッド）\n基金ACN内で時間変更を合意する。\n基金に報告する。\n厚労Teamsの【ロジ関連】スレッドにて中西さんに連絡する。\nスレッド名：「開発に係る打合せの日程調整・周知スレッド」（001_会議・技術資料）", "updated": "2026-07-28", "author": "中澤"}, {"id": "s3", "type": "手順", "title": "資料作成・基金RV（火〜金）", "target": "課題検討会（月 14:00）", "cadence": "週次", "m_cat": "m_cat1", "t_cat": "t_cat2", "content": "## 概要\n課題検討会に向けた資料を作成し、基金RVを通して厚労省へ連携する。\n作業担当\n資料作成：櫻井さんを中心にチーム全体\nRV発出・刈り取り・厚労連携：中里、崎坂\n## 週次スケジュール\n※ 祝日が挟まる場合は各締切の曜日を逆算し直すこと（詳細は補足参照）。\n## 手順\n### STEP 1｜ガワ作成【火曜 18:00】\n対象フォルダ：📁 12_開発課題検討会\n📁[12_開発課題検討会] を開く。\n今週開催分の 📁[yyyymmdd] を右クリック →「コピー」→「ここにコピー」で複製する。\n複製された 📁[yyyymmdd 1] のフォルダ名を翌週の日付に変更する。\nフォルダを開き、以下以外のファイル・フォルダをすべて削除する。\n📄 開発課題検討会_yyyymmdd.pptx\n📁 議事要旨（フォルダ内の 📄 yyyymmdd_1400_開発課題検討会_議事要旨(案) も残す）\n📁 参考（フォルダ自体は残す。中のファイルはすべて削除）\n📄 開発課題検討会_yyyymmdd.pptx のファイル名の日付を翌週の日付に変更する。\n同ファイルを開き、p.1 タイトルスライドの日付・開催時間を翌週のもの（通常 14:00–15:30）に変更する。\n📁 議事要旨 内の 📄 議事要旨(案) のファイル名の日付を翌週の日付に変更する。\n同ファイルを開き、p.1 タイトルスライドの日付・開催時間を翌週のものに変更する。\n⚠️ 綺麗化済みの資料をコピペして次週ガワのベースにしないこと。トラストセンターのプライバシーオプションがオンになり、コメント主が不明になるため。\n### STEP 5-6｜事前課題検討会・基金RV発出【木曜 18:00】\n対象フォルダ：📁 12_開発課題検討会\n事前課題検討会に参加し、議事メモを作成する。\n※ 事前課題検討会の議事メモはOneNoteへのアップロード不要。\n18時ごろ、課題検討チーム（櫻井さん）に資料発出確認を行う。\n発出OKを確認後、資料をダウンロードする。\n📁[12_開発課題検討会] → 翌週日付のフォルダへ移動\n📄 開発課題検討会_yyyymmdd.pptx をダウンロード\nダウンロードした資料を綺麗化する。\n不要なワッペンを外す（不明なものは櫻井さんに確認）\n不要情報を削除する（Alt → F → I → I → I … …）\n基金RV依頼メールを発出する【文案①】。\n締切：木曜 18:00\n発出後、スレッドへ完了報告を入れる\n### STEP 7-8｜基金RV刈り取り【金曜 13:00】\n基金作成分の課題検討会資料を刈り取る。\n締切：金曜 13:00\n12:30 時点で届いていない場合、宮脇さんにチャットまたは声掛けをする\n基金RVの指摘事項を確認する。\n指摘なし → 手順3へ\n指摘あり → SharePoint上の 📄 開発課題検討会_yyyymmdd.pptx に反映 → ダウンロード → 綺麗化 → 再度基金RV発出【文案②】\nRV完了を受領し、返信する【文案②】。\nスレッドへ完了報告を入れる。\n続きは【手順】資料連携_厚労（金〜月）へ。\n### STEP 9｜厚労SPへ資料格納【金曜 14:00】\n発出条件（両方満たしてから実施）\n基金RVの承認を受領済み（宮脇さん）\n課題検討チーム内の発出OKを確認済み（声掛け）\nACN-SP から資料をダウンロードする。\n📁[12_開発課題検討会] → 翌週日付のフォルダへ移動\n📄 開発課題検討会_yyyymmdd.pptx をダウンロード\nダウンロードした資料を綺麗化する。\n不要なワッペンを外す\n不要情報を削除する（Alt → F → I → I → I … …）\n厚労SP（📁 厚労SP_課題検討会）へアップロードする。\n## セルフレビュー\n### STEP 1｜ガワ作成【火曜 18:00】\n☐ 複製したフォルダ名が翌週の日付になっているか\n☐ 残すべき3点（pptx・議事要旨フォルダ・参考フォルダ）だけになっているか\n☐ 📄 開発課題検討会_yyyymmdd.pptx のファイル名・p.1の日付・開催時間が翌週のものになっているか\n☐ 📄 議事要旨(案) のファイル名・p.1の日付・開催時間が翌週のものになっているか\n⚠️ 綺麗化済み資料を次週ガワのベースにコピペしていないか\n### STEP 5-6｜事前課題検討会・基金RV発出【木曜 18:00】\n☐ 課題検討チーム（櫻井さん）から発出OKを得てからダウンロードしているか\n☐ ワッペンが外れているか（不明なものは確認済みか）\n☐ Alt → F → I → I → I … …… の不要情報削除が完了しているか\n☐ 文案①の黄色ハイライト部分を適切に変更しているか\n☐ 基金RV発出が木曜 18:00 までに完了しているか\n☐ スレッドへ完了報告を入れているか\n### STEP 7-8｜基金RV刈り取り【金曜 13:00】\n☐ 金曜 12:30 時点で届いていない場合、宮脇さんへ声掛けしているか\n⚠️ 指摘事項がある場合、SharePoint上のファイルに反映してから再送しているか（ローカル反映に留まっていないか）\n☐ 文案②の黄色ハイライト部分を適切に変更しているか\n☐ スレッドへ完了報告を入れているか\n### 祝日チェック（毎週確認）\n☐ 当週・翌週に祝日が挟まるか確認し、各締切の曜日を逆算し直しているか\n## 補足・ポイント\n綺麗化した資料をコピペして次週ガワのベースにしないこと。トラストセンターのプライバシーオプション「ファイルを保存するときにファイルのプロパティから個人情報を削除する」がオンになり、コメント主が不明になるため。\n祝日パターン別スケジュール変更例\n月曜が祝日（火曜開催）：前営業日は金曜のまま → 影響なし\n金曜が祝日：基金RVを水曜17:00に発出 → 木曜13:00刈り取り → 木曜14:00厚労連携。ただし無理があるため調整が入ることが多い。\n## 文案\n### 【文案①】基金RV依頼メール（木曜 発出時）\n送付前確認事項\n☐ 内部向けコメント・ワッペン（スライド外含む）・不要スライドを削除\n☐ 修正中スライドは右上に「修正中」ワッペンを貼る\n☐ プロパティ削除（Alt → F → I → I → I … …）\n本文\n支払基金　宮脇様\n平素よりお世話になっております。アクセンチュアの[担当者名]です。\nmm/dd(月)開発課題検討会の投影資料を連携させていただきます。\n↓ 共有事項があれば記載（例：「スライド○枚目は完成次第連携いたします」など）\n連日、短納期でのご依頼となってしまい大変恐れ入りますが、\n明日mm/dd(金)14:00に厚労省への連携が必要なため、\nmm/dd(金)13:30までにご確認いただけますと幸いです。\n以上、よろしくお願いいたします。\n### 【文案②】基金RV返信メール（金曜 完了時）\n■ 指摘なし\n支払基金　宮脇様\nいつもお世話になっております。アクセンチュアの[担当者名]です。\nお忙しいところご確認いただきありがとうございます。\nよろしくお願いいたします。\n■ 指摘あり\n支払基金　宮脇様\nいつもお世話になっております。アクセンチュアの[担当者名]です。\nお忙しいところご確認、コメントいただきありがとうございます。\nハイライトいたしました修正箇所について、意図を理解して修正できているか、\nお手数おかけしますがご確認いただけますと幸いでございます。\n■ 該当スライド：P○, ○\nよろしくお願いいたします。", "updated": "2026-07-28", "author": "中澤"}, {"id": "s4", "type": "手順", "title": "厚労省資料連携（金〜月）", "target": "進捗連絡会議（月 13:30）／課題検討会（月 14:00）", "cadence": "週次", "m_cat": "m_cat1", "t_cat": "t_cat2", "content": "## 概要\n基金RVが完了した課題検討会の資料、モデルチームなどから共有される進捗連絡会議の資料を、会議前日14時までに厚労SPに格納し、格納報告を行う。\n目的：会議前に厚労省側が資料を読んでから参加できるようにするため。\n作業担当\n文案作成・格納作業：中里、崎坂\nRV：櫻井さん\n## 週次スケジュール\n## 手順\n### STEP 1｜進捗連絡会議のACN資料を厚労SPへ格納【金曜 14:00】\n格納元フォルダ：📁 11_開発進捗連絡会議\nPMO佐藤さんからの資料発出連絡を確認する。\nACN-SPにアクセスし、以下のパスで資料をダウンロードする。\n📁[11_開発進捗連絡会議] → 📁[yyyymmdd_進捗連絡会議] → 📁[yyyymmdd_進捗連絡会議_制限なし] → 📁[yyyymmdd_ACN資料]\n※ 📁[yyyymmdd_進捗連絡会議_制限あり] も稀にあるため、あわせて確認する。\n通常の格納物（5ファイル）：\n【電カル共有】mmddONS週次報告資料_ver1.0.pptx\nONS問い合わせ・障害報告_yyyymmdd時点.xlsx\n【電カル共有】接続検証環境におけるテスト実施概況_yyyymmdd.pptx\n【電カル共有】本番環境報告資料（エラーコード）_yyyymmdd.xlsx\n本番環境統計データ_mmdd週.pptx\n厚労SPへ格納する。\n通常：📁[04_開発進捗連絡会議（閲覧制限なし）]\nPoC関連の資料：📁[01_2026年度（閲覧制限あり）]\n※ 格納前に不参加事業者の有無を確認し、閲覧制限フォルダに入れてよいか確認すること。\n完了報告をスレッドへ投稿する。\n投稿先：Kamura, Takaki: 【進捗管理】開催報告・資料連携 | 01_課題解決支援 | Microsoft Teams\n### STEP 2｜課題検討会のACN資料を厚労SPへ格納【金曜 14:00】\n格納元フォルダ：📁 12_開発課題検討会\n宮脇さんからの基金RevOKを確認する（13:30目安）。\n課題検討チーム（櫻井さん・中澤さん）に資料発出可能か確認する。\nACN-SPから資料をダウンロードする。\n📁[12_開発課題検討会] → 📁[yyyymmdd] → 📄 開発課題検討会_yyyymmdd.pptx をダウンロード\n資料を綺麗化する。\n不要なワッペンを外す\n不要情報を削除する（Alt → F → I → I → I … …）\n厚労SPへ格納する。\n📁[01_2026年度] → 📁[yyyymmdd_開発課題検討会] のフォーマットで次回日付のフォルダを作成して格納\n厚労TeamsスレッドへTeams投稿する【文案②】。\nチャンネル：厚労Teams「電子カルテ情報共有サービス（外部）」[001_会議・技術資料]\n締切：14:00\n完了報告をスレッドへ投稿する。\n投稿先：Kamura, Takaki: 【進捗管理】開催報告・資料連携 | 01_課題解決支援 | Microsoft Teams\n### STEP 3｜厚労SPの開発事業者資料をACN-SPへアップロード【金曜 18:30】\n格納元フォルダ：📁 04_開発進捗連絡会議（閲覧制限なし）／📁 01_2026年度（閲覧制限あり）\n厚労SPから開発事業者（NTTD・富士通）の資料をダウンロードする。\n※ 制限あり・なしは回ごとに異なるため、両フォルダを必ず確認すること。\nACN-SPにアクセスし、適切なフォルダへアップロードする。\n📁[11_開発進捗連絡会議] → 📁[yyyymmdd_進捗連絡会議] → 制限あり/なしを厚労SP側に合わせて選択\n📁[yyyymmdd_ACN資料] へ格納\n完了報告をスレッドへ投稿する。\n※ RESTful APIに関する資料がある場合は、メールで受領した資料を厚労SP（制限あり）に格納する。\n### STEP 4｜課題検討会の資料を最新断面に差し替え【月曜 13:00】\n格納元フォルダ：📁 12_開発課題検討会　／　宮脇さんのメールで確認\n宮脇さんのRev内容を取り込んだ最新資料を確認する。\nACN-SP上の資料を開き、変更があったスライドをセクションごとにコピーする。\n厚労SPに格納済みの資料を開き、該当スライドを「元の書式を維持（Alt+H+V+K）」で貼り付け差し替える。\n⚠️ 通常の貼り付け（Ctrl+V）は禁止。必ず「元の書式を維持（Alt+H+V+K）」を使うこと。\n格納後に全スライドを目視チェックする（30秒〜1分）。\n格納報告済みスレッドに資料更新の旨を返信投稿する。\n⚠️ スレッドの既存投稿を編集して更新するのはNG。受信側の確認漏れに繋がるため、必ず返信（追加投稿）の形で報告する。\n完了報告（基金ACN内）を行う。\n## セルフレビュー\n### STEP 1｜進捗連絡会議のACN資料格納【金曜 14:00】\n☐ PMO佐藤さんからの資料発出連絡を確認したか\n☐ ダウンロードした資料が5ファイル（ONS関連2・接検1・本番環境2）を下回っていないか\n☐ 格納前に不参加事業者の有無を確認したか\n☐ 不参加事業者がいる場合、閲覧制限フォルダへの格納可否を確認したか\n☐ 完了報告を行ったか\n### STEP 2｜課題検討会のACN資料格納【金曜 14:00】\n☐ 課題検討チーム（櫻井さん・中澤さん）から発出OKを得てからダウンロードしているか\n☐ ワッペンを外したか\n☐ Alt → F → I → I → I … …連打で不要情報を削除したか\n⚠️ 変更スライドの貼り付けに「元の書式を維持（Alt+H+V+K）」を使っているか\n☐ 格納後に全スライドを目視チェック（30秒〜1分）したか\n☐ 完了報告を行ったか\n### STEP 3｜開発事業者資料をACN-SPへアップロード【金曜 18:30】\n⚠️ 厚労SPの制限あり・なし両方のフォルダを確認したか（片方だけ見て終わらない）\n☐ ACN-SP側の格納先フォルダ（制限あり/なし）が厚労SP側と一致しているか\n☐ 完了報告をスレッドへ投稿したか\n### STEP 4｜課題検討会の資料差し替え【月曜 13:00】\n☐ 更新があったスライドをセクションごとに漏れなくコピーできているか\n⚠️ 貼り付けに「元の書式を維持（Alt+H+V+K）」を使っているか\n☐ 格納後に全スライドを目視チェックしたか\n⚠️ スレッドへ返信（追加投稿）の形で更新報告したか（既存投稿の編集はNG）\n☐ 厚労出発前に作業が完了しているか\n☐ 完了報告（基金ACN内）を行ったか\n## 文案\n### 【文案②】課題検討会の資料格納報告（金曜 14:00、厚労Teams）\n本文（パターン①：定刻）\nいつもお世話になっております。アクセンチュアの[担当者名]です。\nMM/DD(月)の開発課題検討会の資料を格納いたしました。\nどうぞよろしくお願いいたします。\n本文（パターン②：遅延・資料全体に基金承認未取得）\n※ 最終調整中のスライドには「作成中」ワッペンを貼り、先に送付する\nいつもお世話になっております。アクセンチュアの[担当者名]です。\n本日(MM/DD)の14時連携予定の、開発課題検討会資料について、\n大変申し訳ございませんが、最終調整中のため、まずはアジェンダのみの共有とさせていただきます。\n○○時メドで再度連携いたします。\nご迷惑おかけして申し訳ありませんが、どうぞよろしくお願いいたします。\n本文（パターン③：遅延・一部未修正/基金承認一部未取得）\n※ 最終調整中のスライドには「作成中」ワッペンを貼り、先に送付する\nいつもお世話になっております。アクセンチュアの[担当者名]です。\n本日(MM/DD)の14時連携予定の、開発課題検討会資料について、\n大変申し訳ございませんが、アジェンダ○「○○」は最終調整中のため、一部の共有とさせていただきます。\n○○時メドで再度連携いたします。\nご迷惑おかけして申し訳ありませんが、どうぞよろしくお願いいたします。\n（本文 共通フッター）\n資料格納リンク：[01_2026年度 のリンクを貼る]\n■ 会議情報\n日時：MM月DD日 14:00–15:30\n場所：厚生労働省13階（＋オンライン）\n会議URL：[Teamsリンクを貼る]\n### 【文案③】遅延後の資料更新報告（スレッドへ返信）\n各位\n平素よりお世話になっております。アクセンチュアの[担当者名]です。\n開発課題検討会資料のご連携を完了いたしました。\n直前のご連携となり、誠に申し訳ございません。\n※ 遅延後更新時：ファイルを誰も開いていなければ上書き保存でOK。スレッドへ追加投稿（返信）で報告する。\n## 参考：廃止済み文案\n以下は2026年4月以降に廃止となった文案です。参考として残しています。\n過去①：進捗連絡会議・基金メール（17時）→ 2026年4月廃止\n過去②：進捗連絡会議・厚労Teams（17時）→ 2026年4月廃止\n過去③：進捗連絡会議・厚労Teams（14時）→ 2026年5月8日廃止", "updated": "2026-07-28", "author": "中澤"}, {"id": "s5", "type": "手順", "title": "開催連絡（金）", "target": "進捗連絡会議（月 13:30）", "cadence": "週次", "m_cat": "m_cat1", "t_cat": "t_cat2", "content": "## 概要\n進捗連絡会議の開催方式（対面/書面）を決定するため、議題募集から開催方式連絡までを行う。\n背景：2026年4月より付議すべき議題がない場合は書面開催となったため、毎週開催方式の確認が必要。\n作業担当\n文案作成：中里、崎坂\nRV：櫻井さん\n## 週次スケジュール\n## 手順\n### STEP 1｜議題募集・資料格納依頼の投稿【金曜 11:00】\n文案①の黄色ハイライト部分（日付・時間）を修正する。\n厚労Teams「電子カルテ情報共有サービス（外部）」[002_厚労省・基金・事業者] へ投稿する。\n※ 基金・厚労・NTTD・富士通の四者全員からの回答が必要。\n※ 月初は厚労省よりマスタに関する共有資料があるが、書面で合意済み。\n完了報告をスレッドへ投稿する。\n投稿先：Kamura, Takaki: 【進捗管理】開催報告・資料連携 | 01_課題解決支援 | Microsoft Teams\n### STEP 2｜議題刈り取り・アジェンダ時間確認【金曜 13:00】\n議題募集スレッドへの返信を刈り取り、全員（基金・厚労・NTTD・富士通）の回答を確認する。\n議事要旨のアジェンダを更新し、議題合計＋ToDo台帳確認＋ラップアップが30分以内に収まるか確認する。\n※ 書面開催分のアジェンダにも変更がある場合は更新すること。\n30分以内に収まる場合：そのまま次のステップへ\n30分を超える場合：\n課題検討会の時間短縮が可能か → ACN内部で確認\n短縮OK → 進捗会議・課題検討会チャットで連絡・Inv時間変更\n短縮NG → 課題検討会終了時刻を後ろ倒し（①ACN確認 → ②厚労確認 → ③基金報告 → ④Inv変更）\n詳細は【手順】開催時間変更時の対応 参照\nPoCに関する議題・ToDoが含まれる場合：\n富士通の議題がない場合 → 通常の進捗連絡会議URLをそのまま使用。周知方法も通常と同じ。\n富士通の議題がある場合 → 前半・後半に分けて実施。後半分のInv・メール文面を作成【文案④・⑤】。\n### STEP 3｜資料格納刈り取り【金曜 13:30】\nNTTD・富士通・厚労省・基金の四者すべての資料格納を確認する。\n未格納の場合、14時の開催方式連絡前に催促する（特に厚労省は早めに）。\n### STEP 4｜開催方式の連絡・各種対応【金曜 14:00】\n文案②（投稿編集）・文案③（返信）の黄色ハイライト部分を修正し、スレッドへ投稿・返信する。\n※ 開始条件：佐藤さんからの連絡 または 14時。佐藤さんからの連絡がない場合は確認すること。\nACN資料格納・厚労省への資料連携を行う。\n詳細は【手順】資料連携_厚労（金〜月）参照。\n不参加事業者が発生した場合、新InvとメールをInv発出する【文案④・⑤】。\n新Inv・メールを送付する\n通常Invの該当日のみを削除する\n⚠️ 「この予定のみ」を選択して削除すること。定期的な予定全体を削除しないよう注意。\n完了報告をスレッドへ投稿する。\n投稿先：Kamura, Takaki: 【進捗管理】開催報告・資料連携 | 01_課題解決支援 | Microsoft Teams\n### STEP 5｜開発事業者資料のダウンロード・アップロード【金曜 18:30】\n詳細な手順は【手順】資料連携_厚労（金〜月）STEP 3 を参照。\n## セルフレビュー\n### STEP 1｜議題募集【金曜 11:00】\n☐ 文案①の黄色ハイライト箇所をすべて修正しているか\n⚠️ 投稿先が [002_厚労省・基金・事業者] になっているか（チャンネル間違えていないか）\n☐ 完了報告をスレッドへ投稿しているか\n### STEP 2｜議題刈り取り・アジェンダ確認【金曜 13:00】\n☐ 基金・厚労・NTTD・富士通の四者すべてから回答が揃っているか\n☐ 議題合計＋ToDo台帳＋ラップアップで30分枠に収まるか確認したか\n☐ 30分を超える場合、ACN内部確認→厚労連絡→Inv変更→資料反映の対応を完了しているか\n☐ 制限あり会議開催の場合、【文案④・⑤】のInvとメール文面を準備しているか\n☐ 書面分のアジェンダも更新したか\n### STEP 3｜資料格納刈り取り【金曜 13:30】\n☐ NTTD・富士通・厚労省・基金の四者すべての資料格納を確認したか\n☐ 未格納の場合、14時の連絡前に催促しているか（特に厚労省）\n### STEP 4｜開催方式の連絡【金曜 14:00】\n☐ 文案②・③の黄色ハイライト箇所をすべて修正しているか\n☐ 開始条件（佐藤さんの連絡 or 14時）を確認したか\n⚠️ 不参加事業者がいる場合、新Inv送付・通常Invの該当日のみ削除を完了しているか\n☐ ACN資料格納と厚労省への資料連携が完了しているか\n☐ 完了報告をスレッドへ投稿しているか\n⚠️ メール送付・メンション時、ACNの宛先・メンションを最後にしているか\n### STEP 5｜開発事業者資料のアップロード【金曜 18:30】\n☐ 厚労SPから各開発事業者のファイルをすべてダウンロードしているか\n☐ ACN-SPの各開発事業者フォルダへ格納しているか（フォルダ階層・日付を確認）\n☐ 完了報告をスレッドへ投稿しているか\n### 月末限定チェック\n☐ 翌月分のフォルダをすべて作成しているか\n⚠️ フォルダコピー時に過去資料が残っていないか（コピー→日付変更→残資料削除の順で実施）\n## 文案\n### 【文案①】議題募集・資料格納依頼（金曜 11:00、厚労Teams）\n本文\nmm月dd日(月) の開発進捗連絡会議について、ご連絡いたします。\n１）開催方式を決めるにあたってのテーマ確認\n２）資料格納依頼\n－－－－－－－－－－－－－－\n１）開催方式を決めるにあたってのテーマ確認\n個別で取り扱いたいテーマ、希望所要時間、参加希望の他の開発事業者\nをこちらのスレッドの返信にてご回答をお願いいたします。\n※ 取り扱いたいテーマがない場合も、その旨をこちらにご回答下さい。\n※ 複数の開発事業者において取り扱うテーマがある場合、後続の会議の調整等の兼ね合いで、参加希望に記載していない開発事業者が参加する場合があります。こちらについては、別途事前に共有いたします。\n<記載例>\n・テーマ１：XXXXXに関する相談（参加希望の開発事業者：なし）[希望所要時間：mm分]\n・テーマ２：XXXXXXに関する確認（参加希望の開発事業者：NTTD/富士通社）[希望所要時間：mm分]\n※ 参加希望事業者の者名をご記載ください。支払基金と厚労省は必ず参加いたします。\n２）資料格納依頼\n13:30までにSharePointへの格納をお願いいたします。\n📁 04_開発進捗連絡会議（閲覧制限なし）\n⚠️ 開催日・開催時間が変更の場合は、その旨を補記すること。\n### 【文案②】開催方式の連絡・投稿編集（金曜 14:00）\nパターン①：書面開催\n本文\nMM月DD日(月)の開発進捗連絡会議は、書面開催といたします。\n■ 資料\n📁 04_開発進捗連絡会議（閲覧制限なし）\n※ 本会議に係る課題・ToDo確認は、開発課題検討会にて、厚労省・基金・ACNで実施する。\n※ 議事要旨の作成は行いません。\nパターン②：会議開催（全事業者参加）\nMM月DD日(月)の開発進捗連絡会議は、会議開催といたします。\n【実施要項】\n■ 日時：月曜日13:30-14:00\n■ 場所：厚生労働省13階＋オンライン\n■ 会議URL：[TeamsリンクURL]\n■ 参加する開発事業者：富士通、NTTD\n■ 議題：\n・[議題1]（[事業者名]）[X分]\n・[議題2]（[事業者名]）[X分]\n■ 資料：📁 04_開発進捗連絡会議（閲覧制限なし）\nパターン③：一部事業者の会議のみ開催\nMM月DD日(月)の開発進捗連絡会議は、会議開催といたします。\n【実施要項】\n■ 時間：13:30-14:00\n■ 場所：厚生労働省13階＋オンライン\n■ 会議URL：\n09_NTTD：メールにて会議情報をお送りいたしますので、そちらをご確認下さい。\n01_電カル共有ライン、02_支払基金、03_ACN：こちらのスレッドをご確認下さい。\n[TeamsリンクURL]\n■ 参加する開発事業者：NTTデータ / 富士通\n■ 議題：\n・[議題1]（[事業者名]）[X分]\n■ 資料：\n書面開催分：📁 04_開発進捗連絡会議（閲覧制限なし）\n会議開催分：こちらのスレッドをご確認下さい。\n※ パターン④（全事業者参加の会議＋一部事業者の会議）が発生した場合は都度チーム内で確認。過去対応は Kamura, Takaki: 【ハイブリッド開催のお知らせ・資料共有】4月6日(月)のスレッドを参照。\n### 【文案③】開催方式の連絡・返信（金曜 14:00）\nパターン①：会議開催\n【MM月DD日 開発進捗連絡会議 会議開催のお知らせ】\nご回答いただきありがとうございました。\n（富士通/NTTデータ）様よりテーマのご希望を頂いたため、MM月DD日の開発進捗連絡会議はハイブリッド（現地＋オンライン）形式にて開催いたします。\n会議の実施要項については、スレッド元の投稿に記載いたしましたので、ご確認ください。\nパターン②：書面開催\n【MM月DD日 開発進捗連絡会議 書面開催のお知らせ】\nご回答いただきありがとうございました。\n皆様よりテーマの希望がなかったため、MM月DD日の開発進捗連絡会議は書面開催といたします。\n会議の実施要項については、スレッド元の投稿に記載いたしましたので、ご確認ください。\n### 【文案④】Inv送付メール（一部事業者参加の場合）\nパターン①：全事業者会議なし・一部事業者の会議のみ開催\n本文\n厚生労働省 各位\n平素より大変お世話になっております。アクセンチュアの[担当者名]です。\nMM/DD(月)の開発進捗連絡会議の会議情報とアジェンダについて、以下に記載いたします。\n【会議URL】\n◯ 時間：開発進捗連絡会議 13:30-14:00\n◯ 会議URL：[TeamsリンクURL]\n会議ID：[会議ID]\nパスコード：[パスコード]\n【報告内容】\n厚労省、支払基金より以下のアジェンダについてご報告をいただきます。\n・[議題1]（希望所要時間：X分）\n・[議題2]（希望所要時間：X分）\nご確認のほどよろしくお願いいたします。\nパターン②：全事業者参加の会議あり・一部事業者の後半会議もあり\n本文\n厚生労働省 各位\n平素より大変お世話になっております。アクセンチュアの[担当者名]です。\nMM/DD(月)の開発進捗連絡会議につきまして、前後半に分けて実施いたします。\n後半の会議情報のご共有と、アジェンダについて以下に記載いたします。\n【会議URL】\n◯ 時間：\n開発進捗連絡会議(前半)：13:30-13:45\n開発進捗連絡会議(後半)：13:45-14:30（※前半枠終了次第、実施予定）\n開発課題検討会：14:30-16:00（※開発進捗連絡会議終了次第、実施予定）\n※ 課題検討会の時間が変更された場合のみ上記の課題検討会時間を記載する。\n◯ 会議URL：[後半用TeamsリンクURL]\n【報告内容】\nNTTデータより以下のアジェンダについてご報告をいただきます。\n・[議題1]\n・[議題2]\nご確認のほどよろしくお願いいたします。\n### 【文案⑤】Inv送付時のスレッド投稿（金曜 14:00、厚労Teams）\nパターン①：全事業者会議なし・一部事業者の会議のみ開催\n本文\nいつもお世話になっております。アクセンチュアの[担当者名]です。\nMM月DD日(月) 13:30-14:00 開催の開発進捗連絡会議の資料を格納いたします。\n本会議は一部事業者が不参加のため、こちらのチャンネルにて資料・会議URLをご共有いたします。\nどうぞよろしくお願いします。\n■ 資料\n書面開催分：📁 04_開発進捗連絡会議（閲覧制限なし）\n会議開催分：📁 01_2026年度（閲覧制限あり）\n■ 会議情報（リンクが変更されているので、ご注意ください）\n[TeamsリンクURL]\nパターン②：全事業者参加の会議あり・一部事業者の後半会議もあり\n本文\nいつもお世話になっております。アクセンチュアの[担当者名]です。\nMM月DD日（月）13:30-14:00 開催の開発進捗連絡会議(後半)の資料を格納いたします。\nどうぞよろしくお願いします。\n📁 01_2026年度（閲覧制限あり）\n※ 上記に格納されているのは、NTTデータによる RESTful API のPoCの報告資料のみです。\n※ もう1つのアジェンダについては、開発進捗連絡会議(前半)の資料（📁 04_開発進捗連絡会議（閲覧制限なし））に格納されております。\n■ 会議情報\n[後半用TeamsリンクURL]\n## 補足\n⚠️ メール送付・メンション時、ACNの宛先/メンションは最後にすること（礼儀のため）。\n⚠️ 📁[04_開発進捗連絡会議（閲覧制限なし）]は月末の進捗連絡会議の際に翌月のフォルダを全て作成しておく。\n手順：コピー → 日付変更 → コピーされたフォルダから残資料を削除 → さらにコピー → 日付変更 → … の繰り返し\n過去資料が残ったままにならないよう注意。", "updated": "2026-07-28", "author": "中澤"}, {"id": "s7", "type": "手順", "title": "議事要旨：作成フロー（金〜月）", "target": "進捗連絡会議（月 13:30）／課題検討会（月 14:00）", "cadence": "週次", "m_cat": "m_cat1", "t_cat": "t_cat3", "content": "## 概要\n木〜金12時でドラフトを準備し、RVと厚労アジェンダを取り込んだうえで月曜会議に参加。会議後のラップアップとチーム内RVを経て、火曜15時までにチーム内完成・基金RV発出につなぐ。\n目的：会議前にドラフトを作成して会議中の工数を最小化する。基金ラップアップで担当者を明確にし、平場に残せる議事要旨の品質を確保する。\n## 週次スケジュール\n## 手順\n### STEP 1｜ドラフト作成【金曜 12:00】\n対象ファイル：📁 12_開発課題検討会 → 📁[yyyymmdd] → 📁[議事要旨] → 📄 yyyymmdd_1400_開発課題検討会_議事要旨(案).pptx\n※ 翌週の日付のファイルを開いていることを確認すること。\n課題検討会の資料を読み込み、想定される合意形成事項・ToDoを議事要旨のドラフトに記載する。\nアジェンダ②「各種台帳の更新確認」については、課題ToDo台帳を確認のうえ以下のステータスをドラフトに反映する。\nクローズ（完了確認）\n期限延伸\n取下げ\n内容変更\n※ ToDo台帳からの進捗取り込みにはAIプロンプト（本ページ末尾）を活用できる。\nチーム内RV依頼を発出する（宛先：櫻井さん/中澤さん）。\n※ 基金マネジメント陣も確認するため、会議に出席していない人が読んでも背景がわかる記載にすること。\n※ 期限延伸・取下げには妥当な理由を記載すること。\n※ 全ToDoに期限と担当者を明記すること。\n### STEP 2-1｜厚労アジェンダの確認【金曜 15:00ごろ】\n厚労省アジェンダを確認し、議事要旨準備に反映する。\n※ 厚労資料は通常、アジェンダのみ[議事要旨・ToDo確認]チャットで金曜夕方に共有される。資料本体は月曜午前中にSharePointにアップロードされるが、アップロード通知はないため能動的に確認が必要。\n### STEP 2-2｜ドラフト確定【月曜 12:00】\n月曜午前中に厚労SPへアップロードされた厚労資料を確認する（通知なし・要能動確認）。\n厚労資料分のドラフトを追加作成する。\n厚労省による課題・ToDo台帳の変更を取り込む。\nチーム内RVの取り込みを完了し、会議中に議事要旨を提示できる状態にする。\n### STEP 3｜会議参加・ラップアップ【月曜 13:30–15:30】\n会議に参加し、議事要旨を作成する。\n会議内ラップアップにて議事要旨をチームへ共有する。\n基金ラップアップにて、議事要旨記載の各ToDoの基金内担当者を確定する。\n基金からの反映点を当日（月曜）中に取り込み、チーム内RV依頼を行う。\n※ 2026/4/28現在、時間の制約上ラップアップ終了後にチーム内RVを行っている。\n### STEP 4｜チーム内確定・基金RV発出【火曜 15:00】\n月曜会議後〜ラップアップまでに修文を行い、チーム内RVを発出する。\n火曜日にRV取り込みを行い、15時までにチーム内でFIXさせる。\n基金RV発出する。\n※ 15時時点で送付できていない場合はスレッドにて遅延報告を行う。\nスレッド：SSK_電子カルテ情報共有サービス > 01_課題解決支援 | Microsoft Teams\n続きは【手順】議事要旨_承認フロー（月〜木）へ。\n## セルフレビュー\n### STEP 1｜ドラフト作成【金曜 12:00】\n☐ 翌週の日付の議事要旨ファイルを開いているか\n☐ 会議資料から想定される合意形成事項・ToDoをすべて記載しているか\n☐ アジェンダ②「各種台帳の更新確認」について、課題ToDo台帳を確認のうえヌケモレなくステータスを反映しているか（クローズ・期限延伸・取下げ・内容変更）\n☐ 期限延伸・取下げには妥当な理由を記載しているか\n☐ 全ToDoに期限と担当者が明記されているか\n☐ 会議に出席していない人（基金マネジメント陣）が読んでも背景がわかる記載になっているか\n☐ 金曜12時までに、チーム内RV依頼を発出しているか\n### STEP 2-1｜厚労アジェンダ確認【金曜 15:00ごろ】\n☐ 金曜日中に厚労アジェンダを確認しているか\n### STEP 2-2｜ドラフト確定【月曜 12:00】\n⚠️ 月曜午前中に厚労SPへアップロードされた厚労資料を確認しているか（アップロード通知がないため能動的に確認）\n☐ 厚労資料分のドラフトを追加作成しているか\n☐ チーム内RVの取り込みを完了し、会議中に議事要旨を提示できる状態になっているか\n### STEP 3｜会議参加・ラップアップ\n☐ 会議内ラップアップで議事要旨をチームへ共有しているか\n☐ 基金ラップアップにて、各ToDoの基金内担当者を確定しているか\n☐ 基金からの反映点を当日（月曜）中に取り込み、チーム内RV依頼を行っているか\n### STEP 4｜チーム内確定【火曜 15:00】\n☐ 15時時点で完了報告もしくは遅延報告を行えているか\n## 補足：ToDo台帳からの進捗取り込み（AIプロンプト活用）\nアジェンダ②「各種台帳の更新確認」の記載作業は、以下のプロンプトをClaude（またはClaude Code）に渡すことで効率化できる。ToDo台帳の対象行（画像・テキスト・Excel貼り付け等）と一緒に渡すと、クローズ案件・期限延伸案件を自動分類し、会議資料にそのまま貼れる形式で出力される。\n▼ プロンプト（以下をそのままClaude/Claude Codeに貼り付けて使用する）\n## ToDo台帳整理GPT 用プロンプト(精度重視・例示強化版)\nあなたは、ToDo台帳の「進捗」欄を確認し、会議資料用の文章を作成するアシスタントです。\nユーザーから、ToDo台帳の一部(画像、表、Excel貼り付け、TSV/CSV風テキスト)が渡されます。\nあなたの役割は、進捗欄の内容を確認し、対象案件を「クローズ」「期限延伸」「記載なし」に分類して、会議資料にそのまま貼れる文章を作ることです。\n# 1. 目的\nToDo台帳の進捗欄から、各ToDoを次の3つに分類する。\n1. 完了確認 → 「1. ToDoのクローズ」に記載する\n2. 期限延伸 → 「2. ToDoの期限延伸」に記載する\n3. どちらにも該当しない → 出力しない\n# 2. 最重要ルール\n判定は進捗欄の記載内容を最優先とする。\n・進捗欄に「完了確認」があれば、クローズ案件として扱う\n・進捗欄に「期限延伸」があれば、期限延伸案件として扱う\n・どちらにも該当しない場合は記載しない\n・迷った場合は、無理に分類せず記載しない側に倒す\n# 3. 判定ルール（代表例）\nクローズ：「完了確認」「報告済み。(完了確認)」「連携済みの旨、報告予定。(完了確認)」など\n期限延伸：「期限延伸」「4/14→4/20」「対応期限を再設定」など\n記載しない：単なる予定共有、相談予定、進行中、進捗記載なしなど\n# 4. 出力フォーマット\n1. ToDoのクローズ\n✓ 下記ToDoをクローズとする。(N件)\n#XXX(要約したToDo内容)\n2. ToDoの期限延伸\n✓ 下記ToDoの対応期限を延伸する。(M件)\n#XXX(要約したToDo内容)\n■延伸期限\n旧期限→新期限\n■期限延伸の背景\n背景説明\n# 5. 表記ルール\n・かっこは半角：#985(案件台帳の記載内容確認)\n・日付矢印はスペースなし：2026/4/14→2026/4/20\n・ブレット記号(・)は使用しない\n・余計な解説は入れない", "updated": "2026-07-28", "author": "中澤"}, {"id": "s8", "type": "手順", "title": "議事要旨：承認フロー（月〜木）", "target": "進捗連絡会議（月 13:30）／課題検討会（月 14:00）", "cadence": "週次", "m_cat": "m_cat1", "t_cat": "t_cat3", "content": "## 概要\n火曜15時に基金RV発出 → 水曜15時に基金承認・厚労RV発出 → 木曜15時に厚労承認受領 → 金曜三者定例で確定。\n目的：進捗連絡会議・開発課題検討会の議事要旨を会議参加者に承認いただき、証跡として残す。\n## 週次スケジュール\n※ 修正が生じた場合の再RV経路：ACN内部（内容確認）→ 基金（内容確認）→ ACN内部（発出承認）→ 再依頼\n## 手順\n### STEP 1｜基金RV依頼メール発出【火曜 15:00】\n前提条件：課題検討チーム内で議事要旨がFIXしていること\nACN-SP上の議事要旨ファイル名末尾に「_Ver1.0」をつける。\n進捗連絡会議：📁 11_開発進捗連絡会議 → 📁[yyyymmdd_進捗連絡会議] → 📁[yyyymmdd_議事要旨] → 📄 yyyymmdd_1330_開発進捗連絡会議_議事要旨(案).pptx\n課題検討会：📁 12_開発課題検討会 → 📁[yyyymmdd] → 📁[議事要旨] → 📄 yyyymmdd_1400_開発課題検討会_議事要旨(案).pptx\n議事要旨2ファイルをダウンロードする。\n綺麗化を行う。\nファイル名末尾の「_Ver1.0」を削除する\n担当者などのワッペンを削除する\n進捗連絡会議はアジェンダスライドとセクションを削除する\nAlt → F → I → I → I … … で個人情報を削除する\n文案①に従い、基金へメールを送付する。\n※ 送付時間が遅れた場合、対応期限はSV（櫻井さん・中澤さん）に相談する。\nACNスレッドへ完了報告を投稿する。\nスレッド：Sakurai, Keita A.: 【進捗管理】議事録作成（進捗連絡会議・課題検討会）\n課題・ToDo台帳にToDoを起票する。\n### STEP 2｜基金承認の受領【水曜 15:00】\n前提条件：基金RV発出済み\n水曜15時までに基金から返信がない場合、宮脇さん（契約関連は西村さん）に直接確認する。\n基金よりToDoの指摘があった場合、以下を繰り返す（承認受領まで）。\n指摘内容をもとに議事要旨を修正し、修正箇所をハイライトする。\n櫻井さんに修正後の承認を得る。\n課題・ToDo台帳へ修正を反映する。\n修正版の承認依頼メールを送る【文案②：修正の場合】。\n文案②（承認の場合）に従い、基金承認メールへ返信する。\nACN-SPに格納されている議事要旨に基金指摘事項を取り込む。\nACNスレッドへ完了報告を投稿する。\nスレッド：Sakurai, Keita A.: 【進捗管理】議事録作成（進捗連絡会議・課題検討会）\n### STEP 3｜厚労RVスレッド発出【水曜 15:00】\n前提条件：基金承認の受領済み（宮脇さんより「一旦承認・後追いで確認」という連絡の場合も含む）\nACN-SP上の議事要旨ファイル名末尾に「_Ver2.0」をつける（STEP1と同じパス）。\n議事要旨2ファイルをダウンロードする。\n綺麗化を行う。\nファイル名末尾の「_Ver2.0」を削除する\n担当者などのワッペンを削除する\nAlt → F → I → I → I … … で個人情報を削除する\n📁[99_進捗連絡会議・課題検討会の議事要旨確認] に進捗連絡会議/課題検討会の議事要旨(案)を格納する。\n文案③に従い、厚労Teams「001_会議・技術資料」チャンネルの以下スレッドへ投稿する。\nスレッド：Nakazawa, Masato: 【議事要旨 厚労省レビュー】進捗連絡会議・開発課題検討会 | 001_会議・技術資料\n※ レビュー期限は発出後1日程度を想定（三者定例時点で厚労RVも終わっていたい）。\nACNスレッドへ完了報告を投稿する。\n### STEP 4｜厚労RV対応・承認受領【木曜 15:00〜17:00】\n前提条件：厚労RV発出済み\n厚労省ACNより[議事要旨・ToDoチャンネル]にて修正依頼事項が届いたら、指摘内容を確認する。\n課題検討チーム（櫻井さん）に判断を仰ぐ。\n修正内容が確定したら、以下の両方の議事要旨を修正する。\nACN-SP上の 📄 議事要旨(案).pptx\n厚労SP 📁[99_進捗連絡会議・課題検討会の議事要旨確認] に格納した 📄 議事要旨(案).pptx\n[議事要旨・ToDoチャンネル]にて、対応内容の確認を厚労ACNへ依頼する。\n厚労よりOKが出たら、基金が👍リアクションを押して終了。\n※ 基本的に内部確認ですりあわせるため、厚労コメントが正式に届くことはほとんどない。\n### STEP 5｜厚労RV終了後の版上げ・台帳更新【木曜中】\n厚労RVでの変更点を、ACN-SP上の進捗連絡会議・課題検討会の議事要旨に反映する（STEP1と同じパス）。\n進捗連絡会議・課題検討会の全スライドタイトルの「(案)」を削除する。\nACN-SP上の議事要旨ファイル名末尾に「_Ver3.0」をつける。\n課題・ToDo台帳の修正を行う。\nACNスレッドへ完了報告を投稿する。\n### STEP 6｜三者定例資料への反映（木〜金）\n詳細は【手順】議事要旨・資料更新（木〜金）を参照。\n### STEP 7｜三者定例後に確定版へ版上げ【金曜中】\n三者定例での議事要旨の変更点を取り込む（変更なしの場合も確認する）。\n議事要旨の全スライドヘッダーのタイトル末尾「(案)」を削除する。\nファイル名を「yyyymmdd_1400_開発課題検討会_議事要旨(案)_Ver3.0」→「yyyymmdd_1400_開発課題検討会_議事要旨_確定版」に変更する（進捗連絡会議分も同様）。\nACNスレッドへ完了報告を投稿する。\nスレッド：Sakurai, Keita A.: 【進捗管理】議事録作成（進捗連絡会議・課題検討会）\n報告例：「mm/dd(月)開発進捗・課題検討会の議事要旨につきまして、確定版へ版上げ完了しましたのでご報告いたします。（3者定例では修正事項特になし）」\n## セルフレビュー\n### STEP 1｜基金RV依頼メール発出【火曜 15:00】\n☐ 15時時点で、基金RV依頼メール発出 または 遅延連絡を行えているか\n☐ 課題検討チーム内で議事要旨がFIXしていることを確認してから動いているか\n⚠️ 送付するファイルの日付は間違っていないか（前週・翌週の資料ではないか）\n☐ 担当者などのワッペンを削除しているか\n☐ Alt → F → I → I → I … …… で個人情報を削除しているか\n☐ 完了報告をスレッドへ投稿しているか\n☐ 課題・ToDo管理台帳へToDoを起票しているか\n### STEP 2-3｜基金承認受領・厚労RV発出【水曜 15:00】\n☐ 水曜15時までに基金から返信がない場合、宮脇さん（契約関連は西村さん）に直接確認しているか\n☐ 議事要旨を修正し、修正箇所をハイライトしているか\n☐ 櫻井さん/中澤さんの承認を得てから再依頼しているか\n☐ 課題・ToDo管理台帳へ修正を反映しているか\n☐ ACN-SP上の議事要旨のファイル名末尾を「_Ver2.0」に変更しているか\n☐ 厚労RV発出前に基金承認を受領しているか（「一旦承認」の連絡がある場合も含む）\n☐ 厚労SP（📁 99_進捗連絡会議・課題検討会の議事要旨確認）に議事要旨を格納しているか\n☐ 完了報告をスレッドへ投稿しているか\n☐ 課題・ToDo管理台帳を修正しているか\n### STEP 4｜厚労承認受領【木曜 15:00〜17:00】\n⚠️ 修正点がある場合、ACN-SPと厚労SPの両方の議事要旨を修正しているか\n☐ 確認事項の場合、課題検討チームで確認し同スレッドで方針を返信しているか\n☐ 厚労ACNに内部確認いただいた後、ACN-SP上のファイル名末尾を「_Ver3.0」に変更しているか\n☐ 厚労承認受領後、三者定例資料内の議事要旨に厚労RV内容を取り込み「未定稿（厚労省様確認中）」ワッペンを外しているか\n☐ 厚労承認受領後、議事要旨の全スライドヘッダーのタイトル末尾「(案)」を削除しているか\n☐ 課題・ToDo管理台帳へ修正を反映しているか\n### STEP 7｜確定版への版上げ【金曜中】\n☐ 三者定例での変更点を取り込んでいるか\n☐ ファイル名を「確定版」に変更しているか（進捗連絡会議分も）\n☐ 完了報告をスレッドへ投稿しているか（三者定例での修正有無も明記）\n## 文案\n### 【文案①】基金RV依頼メール（火曜 15:00）\n送付前確認事項\n☐ 各ToDoの最後の担当・期限を記載しているか\n☐ ワッペン・メモ・個人情報の削除などの綺麗化を実施しているか\n☐ 進捗連絡会議のアジェンダスライドとセクションを削除しているか\n⚠️ 課長（西村さん）が知らないところで契約に関する決定事項・基金ToDoがあった会の議事要旨は、西村さん承認必須。Toに追加すること。\n⚠️ 外部宛てメール送信時はVerify Allにチェックを入れること（入れ忘れると外部メンバーの宛先が抜ける）。\n本文\n支払基金　（西村様、）宮脇様\nお世話になっております。アクセンチュアの[担当者名]です。\n昨日の開発進捗連絡会議・開発課題検討会の合意事項・ToDoにつきまして、\n修正事項がないか、期限が短く申し訳ございませんがMM/DD(水) 15時目途でご確認のほどお願いいたします。\n（修正事項が無い場合も、その旨ご返信お願いいたします。）\n＜添付資料＞\n・開発進捗連絡会議_議事要旨(案).pptx\n・開発課題検討会_議事要旨(案).pptx\nなお、支払基金様のご承認いただいたのち、厚労省様にも展開させていただく予定です。\nご多忙のところ恐れ入りますが、何卒宜しくお願いいたします。\n### 【文案②】基金RV完了返信メール（水曜）\nパターン①：承認の場合\n支払基金　宮脇様\nお世話になっております。アクセンチュアの[担当者名]です。\nご確認ありがとうございます。厚生労働省様へ展開いたします。\n引き続きよろしくお願いいたします。\nパターン②：修正の場合\n支払基金　宮脇様\nいつもお世話になっております。アクセンチュアの[担当者名]です。\nお忙しいところご確認、コメントいただきありがとうございます。\nハイライトいたしました修正箇所について、意図を理解して修正できているか、\nお手数おかけしますがご確認いただけますと幸いでございます。\n■ 該当スライド：P○, ○\nよろしくお願いいたします。\n### 【文案③】厚労TeamsスレッドへのRV依頼投稿（水曜 15:00）\n本文\nお世話になっております。アクセンチュアの[担当者名]です。\nXX/XX課題検討会・開発進捗連絡会議の議事要旨について、レビューをお願いいたします。\n内容をご確認いただき、修正・コメント等がございましたら本スレッドの返信にてご連絡ください。\nなお問題がない場合も、確認完了のご連絡をお願いいたします。\n■ 対象\n・開発進捗連絡会議\n・課題検討会\n■ 格納先：[上記フォルダリンクを貼る]\n■ レビュー期限：2026/MM/DD（木曜日）17:00頃まで\n## 補足\n課長（西村さん）が知らないところで契約に関する決定事項・基金ToDoがあった会の議事要旨は、西村さんの承認が必須。\n外部宛てのメール送信時はVerify Allにチェックを入れること（入れ忘れると外部メンバーの宛先が抜けた状態で送信される）。\n基金の宛先は2026年4月26日時点のもの。変更がある場合は更新すること。\n昔は厚労省への承認はメールで行っており、zip化の際はPWをmhlwyyyymmddに設定していた（現在はTeamsスレッド）。\n※ 関連リンク\n三者定例資料：📁 03_3者MTG(医政局・基金)\n台帳：〔原本〕【電カル共有】課題・ToDo管理台帳.xlsx\n確定版格納：95_会議資料 → 04_開発課題検討会(R7年度より) → 開発課題検討会_yyyymmdd → 議事要旨\n95_会議資料 → 15_進捗連絡会議 → yyyymmdd → 議事要旨", "updated": "2026-07-28", "author": "中澤"}, {"id": "s10", "type": "手順", "title": "議事要旨：事業者送付（火）", "target": "進捗連絡会議（月 13:30）", "cadence": "週次", "m_cat": "m_cat1", "t_cat": "t_cat3", "content": "## 概要\n毎週火曜日、前週の開発進捗連絡会議の確定版議事要旨を開発事業者（NTTD・富士通）へメール送付する。\n目的：事業者へのACN側のToDoの共有。\n※ 2026年5月19日より、当週（今週）の資料送付は廃止。\n## 手順\n### STEP 1｜パターン判断\n先週の進捗連絡会議の開催方式を確認し、送付パターンを決定する。\n⚠️ 他の事業者に見せてはいけないアジェンダが含まれる場合は、事業者ごとにファイルを分けること（ND向け・富士通向けで別ファイルを作成）。閲覧制限ありのフォルダに資料がある場合が目安。\n例：NTTDと厚労省提供のRESTful API PoC資料についての記載がある議事要旨を富士通に送付するとスーパーインシデント。\n### STEP 2｜議事要旨のダウンロード\n📁 11_開発進捗連絡会議 から前週の確定版議事要旨をダウンロードする。\n送付先が事業者ごとに異なる場合（パターン③）、ファイルをコピーして以下のように分ける。\n📄 yyyymmdd_1330_開発進捗連絡会議_議事要旨_確定版_NTTD様向け.pptx\n📄 yyyymmdd_1330_開発進捗連絡会議_議事要旨_確定版_富士通様向け.pptx\n※ ファイル末尾に「_NTTD様向け」「_富士通様向け」をつけて誤送信を防ぐ。\n### STEP 3｜メール準備とレビュー依頼\n文案に従いメールを作成する（宛先・CC・件名・添付ファイルを確認）。\n送付前に以下をスレッドへ投稿してレビューを受ける。\nメール全体のスクリーンショット（CCと添付ファイルが見える形）\n送付先の事業者はどこか・制限あり/なしのどちらと判断したかの説明文\n投稿先：Sakurai, Keita A.: 【依頼】開発事業者への議事要旨・進捗連絡会議資料の送付 | 01_課題解決支援\n### STEP 4｜メール送付\nレビューOKを確認後、メールを送付する。\n## セルフレビュー\n☐ 先週が書面開催だった場合、送付不要と判断しているか\n☐ 閲覧制限ありのフォルダに資料がある場合、送付先を事業者ごとに分けているか\n⚠️ NDと富士通に分けて送る場合、宛先とファイル名に誤りがないか\n☐ スレッドへのレビュー依頼（スクショ＋判断理由）を行ってから送付しているか\n## 文案\n### 送付メール\n本文\n各位\nいつも大変お世話になっております。アクセンチュアの[担当者名]です。\n前週の開発進捗連絡会議の議事要旨を送付させていただきます。\nご確認のほどよろしくお願いいたします。", "updated": "2026-07-28", "author": "中澤"}, {"id": "s11", "type": "手順", "title": "会議参加・議事メモ・報告", "target": "個別検討会（火 15:30／水 10:00）", "cadence": "週次", "m_cat": "m_cat2", "t_cat": "t_cat1", "content": "## 概要\n開発事業者（NTTD・富士通）との個別検討会に出席し、議事メモ作成・ToDo起票・報告を行う。\n対象会議\n個別検討会（NTTD）：基金・NTTD・ACN（火曜 15:30–17:30）\n個別検討会（富士通）：基金・富士通・ACN（水曜 10:00–12:00）\nSP計画・SPRV：基金・NTTD・ACN\n個別検討会ラップアップ：基金・ACN\n## 業務フロー\n## 手順\n### STEP 1｜資料格納（佐藤さん担当）\n会議前日に開発事業者よりメールで届く会議資料をACN-SPへ格納する。\nNTTD：📁 15_ND個別検討会議\n富士通：📁 16_FJ個別検討会議\n⚠️ 同一会議で後から資料更新版が届いた場合、最新版のみを保持し古いバージョンは削除する。同一日付のフォルダは1つのみにする。\n※ 更新版も佐藤さんが項番を振って格納してくれる。課題検討チームにて差分を確認の上、最新版のみ残す。\n### STEP 2｜会議出席・議事メモ作成\n会議に出席し、基金ToDoを把握する。\n議事メモを以下のOneNoteにアップロードする。\nNTTD：📁 基金・ND（OneNoteリンクをここに貼る）\n富士通：📁 基金・FJT（OneNoteリンクをここに貼る）\n※ 2026年4月現在、会議出席は中里、崎坂がメイン。\n※ 課題ごとに論点をまとめるマクロを櫻井さんが作成済みだが、ローカルに落とすとマクロが動かず2026年5月時点では運用に乗っていない。\n### STEP 3｜ToDo確認・台帳起票\n基金とラップアップを行い、ToDo内容・担当者を確認する。\n基金ACN ToDo台帳へ起票する。\n各担当者へ周知する。\n※ 木村さんがメイン。\n## セルフレビュー\n⚠️ 資料更新版が届いた場合、古いバージョンを削除し最新版のみ残しているか\n☐ 会議内のToDoを漏れなく拾えているか\n☐ 議事メモをOneNoteへアップロードできているか", "updated": "2026-07-28", "author": "中澤"}, {"id": "s12", "type": "手順", "title": "議事メモ・ToDo起票", "target": "基金定例（水 16:00）", "cadence": "週次", "m_cat": "m_cat3", "t_cat": "t_cat1", "content": "## 概要\n週次で行われる支払基金–ACN間の定例会に参加し、議事メモを作成・アップロードする。1週間の実施業務を基金に報告し、ToDoが発生した場合は漏れなく台帳に起票する。\n※ 書面開催時：資料送付メールへの返信にコメントがあった場合のみ起票する。過去実績としてのToDo起票はなし。\n## 週次スケジュール\n## 手順\n### STEP 1｜会議参加・議事メモ作成【水曜 16:00–17:00】\n録音を開始する。\n議事メモを作成する。\n作成先：📓 基金定例 OneNote（OneNoteリンクをここに貼る）\n会議終了後、議事メモをアップロードする。\n### STEP 2｜ToDo確認・チーム内レビュー【水曜 17:00〜】\n議事メモからToDoをピックアップする。\n中澤さんと一緒に、攝待さん（または笹川さん）にレビューをいただく。\n### STEP 3｜全体確認・仮起票【水曜 〜18:00】\n基金定例チャンネルへ全体確認の投稿をする。\n基金定例台帳にToDoを仮起票する。\n### STEP 4｜仮起票の修正・確定【木曜 〜12:00】\n全体確認が完了したら、仮起票の内容を修正・確定する。\n## セルフレビュー\n☐ ToDoに漏れがないか\n☐ 基金定例の議事メモをOneNoteへアップロードしているか", "updated": "2026-07-28", "author": "中澤"}, {"id": "s14", "type": "手順", "title": "アジェンダ・会議体更新（火〜木）", "target": "基金定例（水 16:00）→三者定例（金 13:00）", "cadence": "週次", "m_cat": "m_cat3", "t_cat": "t_cat4", "content": "## 概要\n基金定例・三者定例で今週・来週の会議体を正確に周知するため、基金定例前日中にアジェンダと会議体を更新し、チーム内RVを経て佐藤さんに👍をもらう。\n## 週次スケジュール\n## 手順\n### STEP 1｜依頼の受領\n電カル共有チームチャットにて、依頼（またはリマインド）を確認する。\n### STEP 2｜アジェンダの確認・更新\n月曜日の三者定例ラップアップにて確認した次週アジェンダをもとに更新する。\n変更・追加がある場合はアジェンダを修正する。\n### STEP 3｜会議体の確認・更新\n対象会議の条件\n課題検討チームが参加、かつ厚労・基金・ACNの三者が参加する会議\n対象会議の種類\n週次定例：進捗連絡会議、開発課題検討会、三者定例、介護定例、マイナポ定例\nその他：月次報告会、ステコミ、技術作業班、R9以降開発分状況確認会、ヒアリング、開発課題（臨時）等\n会議ステータスの種類（右上の凡例を参照）\n確定 / SKIP / 調整中 で図形の種類が異なる\n確認方法（以下の順で実施）\nOutlookのスケジュールを確認する（自分・櫻井さんの二重チェック）。\nM365 CopilotでOutlookの会議一覧を出力させる（本ページ末尾のプロンプト参照）。\n※ モデルを「Opus」で実行すると漏れなく出力された。「自動」だとほぼ漏れた。\nSVへの確認を行う（必要に応じて）。\nメールやチャットで会議名を検索して補完する。\nイレギュラー時の記載ルール\n書面開催時：書面開催である旨を記載\n三者定例内で確認したい事項がある際：アジェンダに追記\n祝日：該当日の扱いを明示\n⚠️ イレギュラー記載の参考画像はOneNote上の原本を参照すること。\n※ 月次は太字、キャンセルは取り消し線＋枠線なし、アドホックかどうかも確認する。\n### STEP 4｜セルフレビュー\n☐ Outlookのスケジュールを自分・櫻井さんの二重チェックで確認したか\n☐ Copilotで会議一覧を出力し、漏れがないか確認したか\n☐ 右上の凡例に照らして誤った対応がないか（月次は太字、キャンセルは取り消し線＋枠線なし、アドホックの有無）\n### STEP 5｜チーム内RV（中澤さん or 櫻井さん）\n漏れがないか、ステコミ等の日程など周知されていない会議体がないかを確認してもらう。\n完了したら依頼スレッドに完了報告の👍を入れる。\n## 補足：Copilotプロンプト（会議一覧出力用）\n以下をM365 Copilot（モデル：Opus）に貼り付けて実行する。\n以下の条件で、Outlookの会議招待を検索し、表を作成せよ。\n■ 検索条件\n・対象期間：mm/dd〜mm/dd\n・検索対象メールボックス：\n① sakurai.a.keita\n② onsk_e-chartPlatform_ssk_support\n③ [自分のメールアドレス]（自分のカレンダー）\n・上記3つのメールボックスの検索結果を統合（重複は排除）すること。\n・抽出対象：以下のいずれか1つ以上に該当する会議\nA) @mhlw.go.jp が参加者に含まれる\nB) mynakarte が参加者に含まれる\nC) improve_mynakarte が参加者に含まれる\n■ 検索精度を上げるための指示\n・各メールボックスについて、期間を1週間ずつ区切って検索すること。\n・以下の定例会議は毎週/隔週で繰り返されるため、検索結果に含まれない場合でも\n期間内の該当日を推定して記載すること（「※定例推定」と注記する）。\n【毎週月曜】開発進捗連絡会議（13:30-14:00）\n【毎週月曜】開発課題検討会（14:00-15:30）\n【毎週金曜】三者定例（15:00-16:00）\n【隔週木曜】医療介護連携システム打合せ（11:00-12:00）\n【月1回、月曜日】月次報告会（16:00-17:00）\n・全検索結果の会議名一覧を列挙し、フィルタ条件に該当するか1件ずつ確認すること。\n■ 出力形式\n・以下の列を持つ1つの統合表を作成すること（重複排除済み）。\n| 日時 | 会議名 | 該当条件 | 参加者 |\n・「該当条件」列にはA/B/Cのいずれかを記載（複数該当の場合はA,Bのように併記）\n・日時の昇順でソート\n■ 最終チェック\n1. 定例会議が期間内に該当日があるのに表に含まれていないものはないか？\n2. 複数条件に該当する会議の「該当条件」列は正しく併記されているか？\n3. 期間の境界日（初日・最終日）の会議が漏れていないか？", "updated": "2026-07-28", "author": "中澤"}, {"id": "s13", "type": "手順", "title": "会議参加・議事メモ起票", "target": "三者定例（金 13:00）", "cadence": "週次", "m_cat": "m_cat4", "t_cat": "t_cat4", "content": "## 概要\n毎週金曜日に開催される三者定例（厚労省・支払基金・ACN）の会議運営・議事要旨確定業務。\n位置づけ\nその週の月曜開催の進捗連絡会議・課題検討会・モデル定例における合意事項・ToDoの議事要旨を確定させる会議。\n進捗連絡会議・課題検討会よりも上のレイヤーの方が出席している。\n※ 詳細な手順は以下の各ページを参照。\nアジェンダ・会議体更新：【手順】アジェンダ・会議体更新（火〜木）\n議事要旨・資料更新：【手順】議事要旨・資料更新（木〜金）\n## 定常確認事項\n### ONS月次報告の実施確認（毎月第2週）\n## セルフレビュー\n☐ 毎月第2週の三者定例において、ONS月次報告がアジェンダに含まれているか\n☐ 基金定例の「三者定例資料確認」アジェンダで事前に漏れを確認しているか", "updated": "2026-07-28", "author": "中澤"}, {"id": "s15", "type": "手順", "title": "議事要旨・資料更新（木〜金）", "target": "三者定例（金 13:00）", "cadence": "週次", "m_cat": "m_cat4", "t_cat": "t_cat4", "content": "## 概要\n三者定例で課題検討チームが説明する際、進捗連絡会議・課題検討会に出席していない人でも理解できるよう、議事要旨に加えて参考資料を三者定例資料に貼付する。\n※ 2026年4月27日現在、「作業担当 → 中澤さんRV → 👍」の流れを木曜・金曜の2回行う。\n## 週次スケジュール\n## セルフレビュー\n⚠️ 議事要旨の厚労RVが未完了の場合、「未定稿（厚労省様確認中）」ワッペンを貼っているか\n☐ 議事要旨の厚労RVが完了した後、未定稿ワッペンを外しているか\n☐ 議事要旨の中に特定のページ数を指している文言がある場合、参考資料のページ数に合わせて変更したか\n☐ 参考資料を入れる際、右上に白色ワッペンを貼っているか\n## 手順\n### A｜議事要旨の貼り付け・更新\nA-1. 議事要旨の貼り付け\n水曜日に厚労へ発出した進捗連絡会議・課題検討会の議事要旨をコピーし、三者定例資料に貼付する。\n貼付後、右上に黄色ワッペンで「未定稿（厚労省様確認中）」と記載する。\n※ スライドタイトルに章番号もつけておく。\nA-2. 厚労省RV結果の反映\nパターン①：木曜 13:50 までに厚労RVが完了した場合\nACN-SP上の厚労RV後の議事要旨（進捗連絡会議・課題検討会）をコピーする。\n三者定例資料（📄 三者定例資料_yyyymmdd.pptx）を開き、議事要旨のページを開く。\nコピーした議事要旨を「元の書式を維持（Alt+H+V+K）」で貼り付け、差し替える。\n「未定稿（厚労省様確認中）」ワッペンがある元の議事要旨ページを削除する。\n※ スライドタイトルに「(案)」が残っていたら削除する。\n課題解決チーム内部RVを行う。\n厚労ACNの「三者定例暫定版発出スレッド」に👍をする。\nパターン②：木曜 13:50 までに厚労RVが完了しなかった場合\n未定稿ワッペンのまま、課題解決チーム内部RVにあげる。\n問題なければ厚労ACNの「三者定例暫定版発出スレッド」に👍をする。\n翌日（金曜）11:50 までに修正を反映し、本番版を発出する。\nA-3. 三者定例後：確定版への版上げ\n詳細は【手順】議事要旨_承認フロー（月〜木）を参照。\n### B｜参考資料の選定・貼付\nB-1. 参考資料の選定基準\n決定事項・ToDoに関わる内容を含む資料\n重要なスケジュール変更に関わる資料\n※ 固定アジェンダより後のアジェンダの資料は原則全て貼付する（多いに越したことはない）。\nB-2. 貼付時の注意\n資料の右上に白色ワッペンを貼る。\n⚠️ ワッペンを貼る際は、後ろのコンテンツと被ってもよいので、ページによらず固定の位置に貼ること。\n議事要旨内で特定のページを参照している文言がある場合、参考資料のページ数に合わせて変更する。", "updated": "2026-07-28", "author": "中澤"}, {"id": "s16", "type": "手順", "title": "月次報告会・ステコミ", "target": "月次報告会・ステアリングコミッティ", "cadence": "月次", "m_cat": "m_cat5", "t_cat": "t_cat5", "content": "## 概要\n※ 詳細な作業プロセスは「05_議事録作成プロセス」を参照。\n## 週次スケジュール\n## 手順\n### STEP 1｜担当割り振り\n議事録担当\n議事パワポ担当\n逐語録のパート分け\n過去の担当割り振り例（ステコミ）\n### STEP 2｜逐語録作成\n録音・録画をもとに、自分担当パートの文字起こしを行う。\n前半・後半に分けて担当を分ける。\nピアレビュー（担当していない部分を確認）を行う。\n櫻井さんRVを受ける。\n### STEP 3｜議事録作成\nサマリ受領後、逐語録のコピーを作成する。\nサマリ該当箇所を水色ハイライトし、議事録の素材を作成する。\n攝待さんへ連携する。\n## 逐語録作成ルール\n### 録音・録画について\n⚠️ 録画は本当にミスるので複数人で担当を決める（3人全員ミスの実績あり）。\n⚠️ 録音も別で取っておき、両方アップロードする。録音の方が早くアップロードが完了する。\n録画・録音のアップロード先：専用SharePointにアップロードする（SharePointの容量を圧迫するため、別SharePointを使用）。\n### 基本ルール\nフィラーは削除する（文頭の「で」「はい」「えーっと」など意味のない文言）。\n敬語・口語など発言の通りに記載する。\n「？」は使わず「。」にする。例：「でしょうか。」\n数字は基本半角、日付は全角、漢数字は正式名称のみ。\n### フォーマット\n発言と話者の表記形式：\n問題ないと思います。 [支払基金 宮脇]\n発言者を必ず明記する。\n発言と話者の間、話者内の組織名と苗字の間にそれぞれ半角スペースを入れる。\n名前が不明な部分は [xx] と表記し、黄色ハイライトをつける。\n聞き取れない・不鮮明な部分は黄色ハイライトをつける。\n段落が変わるときは段落の上に改行を入れる。\n### 表記ゆれ注意事項\n※ Wordで赤線になる箇所は全て修正する。句読点の前後に半角スペースが入っていないか確認する。\n## 過去資料・参考リンク\nR7年度第4回 資料一式：[OneNoteリンクをここに貼る]\nR7年度第4回 逐語録作成用フォルダ：[OneNoteリンクをここに貼る]\n録画格納先（ステコミ）：[OneNoteリンクをここに貼る]\nR7年度第3回 ステコミ資料一式：[OneNoteリンクをここに貼る]", "updated": "2026-07-28", "author": "中澤"}, {"id": "s17", "type": "手順", "title": "納品（月次）", "target": "月次納品", "cadence": "月次", "m_cat": "m_cat5", "t_cat": "t_cat5", "content": "## 概要\nPMOからの指示に従い、課題検討会の資料・議事要旨および進捗連絡会議の議事要旨を基金（クライアント）へ納品する。\n依頼受領先：Nakazawa, Masato: 【電カル共有】納品依頼 | 05_PMO等 | Microsoft Teams\n## 月次スケジュール\n## 格納物一覧\n※ 正確にはPMO依頼分を確認すること。\n## セルフレビュー\n### 資料\n☐ 別紙を忘れていないか\n⚠️ 厚労作成資料が含まれていないか\n☐ 課題検討会の臨時会を含めるかどうかをチーム内RVで確認したか\n### 議事要旨\n⚠️ ファイル名・スライドタイトルに「(案)」がないか\n☐ 付箋・ワッペンがないか\n☐ （開発進捗連絡会議）アジェンダのページが削除されているか\n☐ 三者定例の内容が反映された確定版であるか\n## 手順\n### STEP 1｜依頼の受領・格納対象の確認\nTeamsのスレッドにてPMOからの依頼を受領する。\n受領先：Nakazawa, Masato: 【電カル共有】納品依頼 | 05_PMO等 | Microsoft Teams\n格納対象を確認し、チーム内RVを行う。\n対象となる資料は別紙含め、ACNが作成したもの。\nステータス（FIX済みか）は作成者やそのRV担当者へ確認する。\n格納先が分かれていたり前月と異なる場合は不明点をPMOに確認する。\n### STEP 2｜格納\n課題検討会・進捗連絡会議のフォルダにアクセスし、対象月の資料をダウンロードする。\n綺麗化を行う（ワッペンをすべて外す）。\n※ 綺麗化はPMOが担当してくれる場合あり。\n以下の格納先に格納する。\n■ 開発課題検討会資料の格納先\n別紙なし：「課題検討資料」>「開発課題検討会資料」にファイルごと（フォルダ切らず）格納\n別紙あり：「課題検討資料」>「開発課題検討会資料」>「開発課題検討会_yyyymmdd」フォルダを作成し格納、別紙は同フォルダ内に「別紙」フォルダを作成して格納\n■ 議事要旨の格納先\n格納場所：「議事取りまとめ」>「開発課題検討会」または「開発進捗連絡会議」\n日付ごとに分けずに直接格納する\nファイルバージョンが「確定版」であることを確認する\n確認ポイント：三者定例の内容が反映されているか、スライドタイトルに「(案)」がないか、付箋・ワッペンがないか、（開発進捗）アジェンダのページが削除されているか\n### STEP 3｜チーム内RV発出\n以下の内容でRVを発出する。\n宛先：Sakurai, Keita A.さん（CC: Nakazawa, Masatoさん、Sato, Tomomi A.さん）\nRV依頼文面例\n課題解決支援チーム分の納品物に間違いないかRVをお願いいたします。\n今月は進捗連絡会議、開発課題検討会、ステアリングコミッティが開催されました。\n（臨時会がある場合）また、開発課題検討会の括りで臨時会議〇件がありました。\n（例：6/11：12月リリース案件の整理、6/24：12月リリース案件候補の擦り合わせ）\n■ 納品物RV依頼\n定例資料：7. 課題報告資料\n進捗連絡会議、開発課題検討会、ステアリングコミッティ会議資料と別紙\n議事録：9. 議事取りまとめ\n進捗連絡会議、開発課題検討会、ステアリングコミッティ（サマリ、議事録、逐語録）\n上記で抜け漏れないか。ご確認のほどよろしくお願いいたします。\n### STEP 4｜完了報告\n格納完了後、PMOに👍リアクションをする。\n完了報告を投稿する。\n完了報告文面例\nNakazawa, Masatoさん、Sato, Tomomi A.さん\nお疲れ様です。課題解決支援チーム分、格納しました。", "updated": "2026-07-28", "author": "中澤"}, {"id": "s6", "type": "メモ", "title": "議事要旨：作成メモ", "target": "進捗連絡会議 ／ 課題検討会", "cadence": "-", "m_cat": "m_cat6", "t_cat": "t_cat3", "content": "## 記載内容のチェックリスト\n議事要旨に盛り込むべき内容の観点です。\n### 内容面\n5W1H（誰が・いつ・何を・なぜ・どのように）が明記されているか\nふわっとした雰囲気日本語を避けているか（具体的な言葉を使う）\n平仄が取れているか（同じ構造のものは同じ書き方で統一）\n資料名・ページ数などの出典を記載しているか\n期限の妥当性を確認しているか\n期限が延伸になった場合、理由を記載しているか\n打合せに出ていない人が読んでも理解できる記載になっているか\n背景・経緯も伝わる内容になっているか\nマネジメント層が読むことを前提とした書きぶりになっているか\n### 表現・テクニック\n「の」の多用を避けているか\n主語と述語が一致しているか\n「名詞＋名詞」のみの繋がりを避け、助詞を適切に使っているか\n「とおり」は接続詞として使う場合はひらがなにしているか\n箇条書きの階層が適切か（深すぎる・浅すぎる構造になっていないか）\n### 見た目・書式\n日付・時間の表記が統一されているか\nフォントが統一されているか\n文字サイズが統一されているか\n半角・全角の使い分けが統一されているか\n### ToDoの書き方\n台帳で管理しやすい粒度・形式で記載しているか（担当者・期限・内容が明確か）\n## フェーズ別の作業ポイント\n### 会議前（ファイル準備）\nファイルを開く前に編集個人情報の記録を有効化する。\n設定場所：ファイル → オプション → トラストセンター → プライバシーオプション → 「ドキュメント固有の設定」のチェックを外す\n### 開発課題検討会の前日まで\nあらかじめ会議資料を読み込み、発生しうる合意形成事項・ToDoを予測しておく。\n資料の内容が理解できない場合は、作成者にインタビューして理解を深めておく。\n### 開発課題検討会 当日（会議中）\n発言者に注意しながら議事メモを取る。\n### 開発課題検討会 当日（ラップアップ・会議後）\n議事要旨に記載のあるToDoのうち、【基金 X/Y】担当となっているToDoについては、ラップアップ内で基金内の担当者を割り振る。\nラップアップ完了次第、その断面の議事要旨を基金にチャット連携し、各ToDoの担当者・期限をハイライトして送付する。\n月曜日中に合意形成事項・ToDoを修文・構造化し、櫻井さんRV・内部承認まで持っていく。\n議事要旨の内容がFIXされ次第、中里・崎坂にてToDo台帳を更新する（火曜18時まで）。\n## 受領FBまとめ\n以下は実際に議事要旨作成時に受領したフィードバックです。同じ指摘を繰り返さないための参照用としてまとめています。\n### 構造・まとめ方\n同一の案件・課題由来のToDo・決定事項はまとめて構造化して記載する。\n例）案件ID091・ID072 など同一テーマのものは1つのブロックにまとめる。\n要件がFIXしていない内容（実装要否が未検討・ニーズに懸念がある等）については、合意形成事項ではなくToDoとして記載し、案件台帳の記載修正にとどめる。\n### 記載の具体性\n合意形成事項・ToDoの中身は、議事要旨だけを見ても案件の内容と決定内容が伝わるよう、5W1Hを具体的に記載する。\n一般化・抽象化しすぎない。\nNG例：「12月調達」\nOK例：「調達は12月リリース案件と併せて実施」\n合意形成事項に「〜問題ないか確認する」という書き方は不適切。「〜とする」と記載する。\n### 事実の記録\n議事要旨の書きぶり・温度感はSVが判断するため、まずは「事実を全て記載する」ことを優先する。\n資料に記載があっても発言されていないものは議事要旨には書かない。\n「事実」とは会議内で発言されたかどうか。会議内の発言を文書として記録することが議事要旨の目的。\nToDo・決定事項として記載したものを落とすのは容易。書くのは大変。→ 事実は全て盛り込む。\n不要な主観を挟まない。無言は承諾ではない。", "updated": "2026-07-28", "author": "中澤"}, {"id": "s9", "type": "台帳", "title": "課題・ToDo台帳（バイネーム記載）", "target": "〔原本〕課題・ToDo管理台帳.xlsx", "cadence": "-", "m_cat": "m_cat6", "t_cat": "t_cat6", "content": "## 概要\nToDoの担当者をバイネームで記載し、各ToDoを誰が実施したのかを明確にして、未対応のタスクが残らないようにする。\n基金定例・三者定例・進捗連絡会議・開発課題検討会で使用する資料のため、各会議の前に整理が完了している必要がある。\n⚠️ 2026年5月20日より、コピペ用Excelを櫻井さんより共有いただき、それに従い対応する運用に変更された。\n## 業務フロー\n## セルフレビュー\n☐ 全体を見返したか\n☐ 起票したToDoの行は、全列青字になっているか\n☐ 期限が1週間以内でないものは、セル黄色ハイライトを外しているか\n☐ 完了したToDoについて、進捗にきちんと記載しているか\n☐ 完了したToDoについて、ステータスを「完了」にしているか\n☐ 期限延伸したToDoの進捗において、会議前の進捗を黒字に戻し、会議後に記載した進捗は青字になっているか\n⚠️ 期限延伸したToDoについて、進捗欄に書かれた期限通りに期限を変更しているか（変更忘れがないか）\n## 基本ルール\n### 文字色\n### セルハイライト\n黄色：会議での報告箇所（期限が1週間以内のもの）\n### 記載対象・範囲\n厚労・基金間のToDoに限る。基金ACNなどACN内部の記載はしない。\n→ 黒川さんの意向で基金メンバーがタスクを担っている状態にするため。\n課題に紐づくToDoは「開発課題」シートの「進捗」列に記載する。\nToDoシート内の組織に「基金」を含み、かつ担当者名がバイネームで記載されていないものは担当者をバイネームで記載する。\n## 手順\n### ToDo起票\n議事要旨に従い、全列青字で起票する。\n⚠️ 担当者欄は、基金ラップアップにて確認した担当者をバイネームで記入する。\n⚠️ 議事要旨をコピーすると改行がうまくいかない場合があるため、その場合は手作業で修正する。\n担当者の特定方法（バイネームが不明な場合）\n対象ToDoを理解し、誰が担当者になりうるか想定する（インプット：議事メモ・Teams・Outlookのやり取り）。\nラップアップにて、担当者を確認する。\nモデルTのToDoも含まれる場合は、モデルTとどのToDoが担当かを意識合わせする（特に付議先が三者定例の場合）。\n不明な場合は、開発Tのリーダー・宮脇さんに確認し、各担当者へ進捗含め確認する。\n### ToDoのクローズ\n「進捗」にクローズのコメントを記載する。\n「ステータス」を「完了」に変更する。\n「進捗」の文字を全て黒字にする。\n※ 会議にてクローズに合意したToDoはクローズしていく。クローズの際には合意した会議体を記載すること。\n記載例\n2026/4/22 ACN [担当者名]\n開発進捗連絡会議にて完了確認を行ったため、クローズとする。\n### ToDoの期限延伸\n「進捗」に期限延伸のコメントを青字で記載する。\n「進捗」のうち、会議前に記載された部分を全て黒字にする。\n「期限」を延伸後の期限に変更する。\n変更後の「期限」を青字にする。\nセルの黄色ハイライトを外す。\n※ 期限延伸の妥当性を記述すること。日付の更新はToDoへの記載だけでなく、会議での合意をもって承認される。\n記載例\n2026/5/18 ACN [担当者名]\n開発進捗連絡会議にて期限延伸に合意したため、対応期限を変更する。\n■ 延伸期限\n2026/5/15→2026/5/22\n■ 背景\n現行の富士通側の運用保守コストから、臨床情報一覧提供機能に係る運用保守コストを整理する作業に時間を要しているため。\n### ToDoの記載変更\n一度ToDoをクローズし、新たなToDoを新規起票する。\n記載変更後の内容で新たに起票する（新番号を付与）。\n元のToDoの「進捗」に青字で「開発課題検討会にて本ToDoのクローズに合意したため、本ToDoはクローズとする。」と記載し、クローズ手続きを行う。\n### その他（進捗記載のみ・会議でクローズしなかったもの）\nセルの黄色ハイライトを外す。\n会議前に記載した文字のみ黒字に変更する。\n## 補足\n関連ファイル・リンク\n課題・ToDo台帳（原本）：〔原本〕【電カル共有】課題・ToDo管理台帳.xlsx\n案件台帳：厚労の「001_会議・技術資料」に紐づくSPの「001_開発案件管理」→ _01_案件台帳（原本）\n保管フォルダ：https://mhlwlan.sharepoint.com/sites/ext_325/…（OneNote上のリンクを参照）", "updated": "2026-07-28", "author": "中澤"}, {"id": "s18", "type": "手順", "title": "参加者名簿更新", "target": "進捗連絡会議", "cadence": "随時", "m_cat": "m_cat6", "t_cat": "t_cat6", "content": "## 概要\nPMOより依頼を受け、進捗連絡会議の参加者名簿を厚労省へ連携する。\n## 手順\n※ 運用状況を確認してから実施すること。\nPMOより依頼を受領する。\n参加者名簿（Excelファイル）をダウンロードする。\nファイル名：01_進捗連絡会議メンバー\n厚労SPの以下のフォルダへ格納し、古いバージョンを 📁 old へ移動する。\n格納先：電子カルテ情報共有サービス（外部）> 001_会議・技術資料 > 参加者名簿\nPMOへ完了報告をする。", "updated": "2026-07-28", "author": "中澤"}, {"id": "s19", "type": "参考", "title": "会議調整・Inv更新", "target": "", "cadence": "随時", "m_cat": "m_cat6", "t_cat": "t_cat6", "content": "## 概要\n各会議における社内・社外の実施調整を行い、円滑な会議運営を目指す。\n調整の基本フロー\nチーム内部調整 → 厚労ACN → 基金 → NTTD・富士通 → 厚労\n## Inv一覧（2026年5月13日時点）\n※ Invは基本的に年度末に翌年度末まで更新する。\n## 調整先一覧\n## 会議体別 参加者・Inv情報\n## リスケ対応\n### 月曜ラップアップ（月次報告会開催月）\n月次報告会がある月は、ラップアップを翌火曜日に変更する（例：6/22→23、7/13→14、14:00–15:00）。\n宮脇さんが参加できない場合の代替候補日時：\n火曜 9:00–10:00\n火曜 15:00–15:30（ONS問合せ共有会の前）\n火曜 17:30–18:00（基金の定時後のため注意）\n※ 8月以降の変更は都度確認が必要。\n### 祝日に伴うリスケ\n厚労中西さんより厚労Teamsにてリスケ案が示される。基金ACN・フォーティエンスは合意済みとなる場合が多い。\n基金からのリアクションがない場合でも、NGコメントがなければ合意として扱うが都度確認が必要。\n⚠️ GW以降（7/20以降）など遠い先の祝日対応は未対応のことがあるため、早めに確認する。\n### その他\n三者定例向けの会議体更新（火曜）の際に、当該週・翌週でAdhoc会議による玉突きリスケが起きていないか自分で確認する。", "updated": "2026-07-28", "author": "中澤"}];
const CATS_MEETING = [{"id": "m_cat1", "label": "進捗連絡会議・課題検討会", "cadence": "週次", "color": "#3b82f6"}, {"id": "m_cat2", "label": "個別検討会", "cadence": "週次", "color": "#8b5cf6"}, {"id": "m_cat3", "label": "基金定例（水）", "cadence": "週次", "color": "#059669"}, {"id": "m_cat4", "label": "三者定例（金）", "cadence": "週次", "color": "#0d9488"}, {"id": "m_cat5", "label": "月次報告会・ステコミ・納品", "cadence": "月次", "color": "#d97706"}, {"id": "m_cat6", "label": "台帳・随時対応", "cadence": "-", "color": "#6b7280"}];
const CATS_TASK = [{"id": "t_cat1", "label": "会議参加・議事メモ作成", "cadence": "週次", "color": "#3b82f6"}, {"id": "t_cat2", "label": "資料作成・連携", "cadence": "週次", "color": "#8b5cf6"}, {"id": "t_cat3", "label": "議事要旨", "cadence": "週次", "color": "#059669"}, {"id": "t_cat4", "label": "定例準備・会議体管理", "cadence": "週次", "color": "#0d9488"}, {"id": "t_cat5", "label": "月次業務", "cadence": "月次", "color": "#d97706"}, {"id": "t_cat6", "label": "台帳・随時対応", "cadence": "-", "color": "#6b7280"}];

let curId = null;
let viewMode = 'meeting';
let chkState = JSON.parse(localStorage.getItem('chkState')||'{}');

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

function inlineProcess(t){
  let r = esc(t);
  r = r.replace(/(📁)([^\s,。、<\n（）]+)/g,'$1<span class="fr">$2</span>');
  r = r.replace(/(📄)([^\s,。、<\n（）]+)/g,'$1<span class="fr">$2</span>');
  return r;
}

function renderContent(raw, secId){
  const lines = raw.split('\n');
  let html = '';
  let buf = [];
  let inBun = false;
  let bunBuf = [];

  function flushBuf(){
    if(!buf.length) return;
    if(buf.length===1) html += '<p>'+inlineProcess(buf[0])+'</p>';
    else{ html+='<ul class="lns">'; buf.forEach(l=>{ html+='<li>'+inlineProcess(l)+'</li>'; }); html+='</ul>'; }
    buf=[];
  }
  function flushBun(){
    if(!bunBuf.length) return;
    html += '<div class="bun">'+esc(bunBuf.join('\n'))+'</div>';
    bunBuf=[];
  }

  for(const rawL of lines){
    const l = rawL.trim();
    if(!l){ flushBuf(); flushBun(); continue; }
    if(l.startsWith('## ')){
      flushBuf(); flushBun();
      const h = l.slice(3);
      inBun = (h==='文案'||h.startsWith('文案'));
      html += '<h2>'+esc(h)+'</h2>';
    } else if(l.startsWith('### ')){
      const h = l.slice(4);
      if(inBun){ flushBun(); html+='<h3>'+esc(h)+'</h3>'; }
      else { flushBuf(); html+='<h3>'+esc(h)+'</h3>'; }
    } else if(l.startsWith('☐ ')){
      flushBuf(); flushBun();
      const id='c'+Math.random().toString(36).slice(2,8);
      const txt = l.slice(2);
      const key = secId+'|'+txt;
      const ckd = chkState[key]?'checked':'';
      html+=`<div class="chk"><input type="checkbox" id="${id}" ${ckd} onchange="saveChk('${key}',this.checked)"><label for="${id}">${inlineProcess(txt)}</label></div>`;
    } else if(l.startsWith('⚠️')){
      flushBuf(); flushBun();
      html+='<div class="wrn">'+inlineProcess(l)+'</div>';
    } else if(l.startsWith('※')){
      if(inBun) bunBuf.push(l);
      else { flushBuf(); html+='<div class="nt">'+inlineProcess(l)+'</div>'; }
    } else if(l.startsWith('▼') || (inBun && l.startsWith('# '))){
      bunBuf.push(l);
    } else {
      if(inBun) bunBuf.push(l);
      else buf.push(l);
    }
  }
  flushBuf(); flushBun();
  return html||'<div class="empty-sec">（このセクションの詳細は原本docxを参照してください）</div>';
}

function saveChk(key,val){
  chkState[key]=val;
  localStorage.setItem('chkState',JSON.stringify(chkState));
}

function switchView(mode){
  viewMode = mode;
  document.getElementById('btn-meeting').classList.toggle('active-view', mode==='meeting');
  document.getElementById('btn-task').classList.toggle('active-view', mode==='task');
  buildNav(mode);
}

function buildNav(mode){
  const nav = document.getElementById('nav');
  nav.innerHTML = '';
  const cats = mode === 'task' ? CATS_TASK : CATS_MEETING;
  const catKey = mode === 'task' ? 't_cat' : 'm_cat';
  cats.forEach(cat=>{
    const hd = document.createElement('div');
    hd.className='cat-hd';
    hd.innerHTML=`<span class="cat-cadence ${cat.cadence}">${cat.cadence}</span><span class="cat-name">${esc(cat.label)}</span><span class="cat-arrow">▼</span>`;
    hd.onclick=()=>toggleCat(cat.id);
    nav.appendChild(hd);
    const body = document.createElement('div');
    body.className='cat-body'; body.id='cat_'+cat.id;
    const catSecs = SECS.filter(s=>s[catKey]===cat.id);
    catSecs.forEach(s=>{
      const el = document.createElement('div');
      el.className='ni'; el.id='ni_'+s.id;
      el.innerHTML=`<span class="ni-bd bd-${s.type}">${s.type}</span><span class="ni-tx">${esc(s.title)}</span>`;
      el.onclick=()=>showSec(s.id);
      body.appendChild(el);
    });
    nav.appendChild(body);
  });
  if(curId){
    const ni = document.getElementById('ni_'+curId);
    if(ni){ ni.classList.add('active'); }
  }
}

function toggleCat(catId){
  const body = document.getElementById('cat_'+catId);
  const hd = body.previousElementSibling;
  const collapsed = body.classList.toggle('collapsed');
  hd.classList.toggle('collapsed', collapsed);
}

function buildSections(){
  const cont = document.getElementById('sc');
  SECS.forEach(s=>{
    const cat = CATS_MEETING.find(c=>c.id===s.m_cat)||{label:'',color:'#6b7280'};
    const div = document.createElement('div');
    div.className='sec'; div.id='sec_'+s.id;
    const tgt = s.target ? `<span class="tgt">${esc(s.target)}</span>` : '';
    div.innerHTML=`
      <div class="sec-meta">
        <span class="sec-cadence ${s.cadence}">${esc(s.cadence)}</span>
        <span class="sec-cat-tag" style="background:${cat.color}">${esc(cat.label)}</span>
        <span class="sec-type ${s.type}">${s.type}</span>
        ${tgt}
        <span class="upd">最終更新：${s.updated}　担当：${s.author}</span>
      </div>
      <div class="sec-h1">【${esc(s.type)}】${esc(s.title)}</div>
      <div class="cb">${renderContent(s.content, s.id)}</div>`;
    cont.appendChild(div);
  });
}

function showSec(id){
  curId=id;
  document.querySelectorAll('.sec').forEach(e=>e.classList.remove('active'));
  document.querySelectorAll('.ni').forEach(e=>e.classList.remove('active'));
  document.getElementById('srch-res').style.display='none';
  document.getElementById('welcome').style.display='none';
  const secEl = document.getElementById('sec_'+id);
  if(secEl) secEl.classList.add('active');
  const ni = document.getElementById('ni_'+id);
  if(ni){ ni.classList.add('active'); ni.scrollIntoView({block:'nearest'}); }
  const s = SECS.find(x=>x.id===id);
  document.getElementById('cur-ttl').textContent = s? '【'+s.type+'】'+s.title : '';
  document.getElementById('ca').scrollTop=0;
}

function doSearch(q){
  const sr = document.getElementById('srch-res');
  document.querySelectorAll('.sec').forEach(e=>e.classList.remove('active'));
  document.getElementById('welcome').style.display='none';
  if(!q.trim()){ sr.style.display='none'; if(curId) showSec(curId); return; }
  const kw = q.trim().toLowerCase();
  const hits=[];
  SECS.forEach(s=>{
    const txt=(s.title+' '+s.target+' '+s.content).toLowerCase();
    if(txt.includes(kw)){
      const idx=txt.indexOf(kw);
      const start=Math.max(0,idx-40);
      const snip=(s.title+' '+s.target+' '+s.content).slice(start,start+120).replace(/\n/g,' ');
      hits.push({s,snip});
    }
  });
  sr.style.display='block';
  if(!hits.length){ sr.innerHTML='<p style="color:#6b7280">「'+esc(q)+'」は見つかりませんでした</p>'; return; }
  sr.innerHTML='<p style="font-size:12px;color:#6b7280;margin-bottom:12px">'+hits.length+'件ヒット</p>'+
    hits.map(({s,snip})=>`<div class="sr-item" onclick="showSec('${s.id}')">
      <div class="sr-sec">【${esc(s.type)}】${esc(s.title)}</div>
      <div class="sr-txt">...${esc(snip)}...</div>
    </div>`).join('');
  document.getElementById('cur-ttl').textContent=hits.length+'件ヒット';
}

function resetAll(){
  if(!confirm('すべてのチェックをリセットしますか？')) return;
  chkState={};
  localStorage.setItem('chkState','{}');
  document.querySelectorAll('.chk input[type=checkbox]').forEach(el=>{el.checked=false;});
}

window.onload=()=>{
  buildNav('meeting');
  buildSections();
};
</script>
